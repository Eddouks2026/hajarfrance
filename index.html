function programmeMission(d,s){
  const T=JOURS[d].s[s], out=[]; const nbFiches=T.filter(x=>x.k==="fiche").length;
  if(nbFiches) out.push(nbFiches===1?"une petite fiche à lire":nbFiches+" petites fiches à lire");
  T.forEach(x=>{ const f=x.f||{};
    if(x.k==="cartes") out.push("un jeu de cartes mémoire");
    else if(x.k==="quiz") out.push(f.k==="a"?"des écoutes":f.k==="r"?"des lectures":f.k==="g"?"de la grammaire":f.k==="v"?"du vocabulaire":f.s===1?"des mises en situation":"un quiz");
    else if(x.k==="exam") out.push("un examen blanc, comme le vrai");
    else if(x.k==="frtest") out.push("un test blanc de français");
    else if(x.k==="dictee") out.push("une petite dictée");
    else if(x.k==="frise") out.push("le jeu de la frise des dates");
    else if(x.k==="images") out.push("le jeu des images de Coco");
    else if(x.k==="ecrire") out.push("un petit texte à écrire");
    else if(x.k==="parler") out.push("un exercice pour parler");
    else if(x.k==="defi") out.push("un défi de 60 secondes");
    else if(x.k==="revoir") out.push("tes erreurs à revoir");
    else if(x.k==="faible") out.push("tes points faibles");
  });
  return [...new Set(out)];
}

// Feu d’artifice (pour les grands moments)
function feuxArtifice(parent,duree){
  if(reduced) return;
  const c=document.createElement("canvas"); c.className="feux"; (parent||document.body).appendChild(c);
  const dpr=window.devicePixelRatio||1; c.width=innerWidth*dpr; c.height=innerHeight*dpr;
  const g=c.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  let parts=[], next=0; const fin=Date.now()+(duree||4000);
  const boum=()=>{ const x=innerWidth*(0.15+Math.random()*0.7), y=innerHeight*(0.12+Math.random()*0.35), col=rnd(COUL_FETE); for(let i=0;i<70;i++){ const a=Math.random()*Math.PI*2, v=1.2+Math.random()*3.8; parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,v:1,col}); } };
  const frame=()=>{ const t=Date.now(); if(t<fin && t>next){ boum(); next=t+300+Math.random()*350; }
    g.clearRect(0,0,innerWidth,innerHeight);
    parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.045; p.vx*=0.985; p.vy*=0.985; p.v-=0.011; g.globalAlpha=Math.max(p.v,0); g.fillStyle=p.col; g.beginPath(); g.arc(p.x,p.y,2.6,0,6.3); g.fill(); });
    parts=parts.filter(p=>p.v>0);
    if((t<fin||parts.length) && c.isConnected) requestAnimationFrame(frame); else c.remove(); };
  frame();
}

// Effort récompensé : le temps passé compte, pas seulement les bonnes réponses
let derniereAction=Date.now();
["pointerdown","keydown","input"].forEach(ev=>document.addEventListener(ev,()=>{ derniereAction=Date.now(); },{passive:true}));
setInterval(()=>{
  if(document.visibilityState!=="visible" || Date.now()-derniereAction>3*60*1000) return;
  S.temps=S.temps||{}; const avant=S.temps[today()]||0; S.temps[today()]=avant+15;
  const palier=(min,type,txt)=>{ if(avant<min*60 && avant+15>=min*60){ const c=gagne([type]); ouvrirCadeau(c,txt,"Tes efforts sont récompensés !",null,min>=OBJECTIF_MIN); return true; } return false; };
  if(!palier(60,"bonbon","1 heure de travail !") && !palier(120,"bisou","2 heures de travail !") && !palier(180,"bonbon","3 heures de travail !") && !palier(OBJECTIF_MIN,"calin","4 heures aujourd’hui !") && (avant/15)%4===0) save();
},15000);

/* ---------- Cartes mémoire : question, puis réponse, puis « je savais / je ne savais pas » ---------- */
function cartes(T,task){
  hush(); closePanel();
  let paquet=choisir(T.w||"civ",T.f,T.n).map(x=>({it:x,deja:false})); const total=paquet.length; let sues=0, vues=0;
  if(!total){ return task ? suiteApres(task, marquer(task)) : home(); }
  const montrer=()=>{
    if(!paquet.length) return finCartes();
    const c=paquet[0], it=c.it, [lab,col]=label(it);
    app.innerHTML=`<div class="haut-jeu"><button class="fermer" data-act="quit" aria-label="Quitter">${ICO.x}</button><div class="jauge vert"><div style="width:${Math.min(100,vues/total*100)}%"></div></div><span class="chrono">${Math.min(vues+1,total)}/${total}</span></div>
    ${etiquetteTache(task)}<span class="etiquette" style="background:${col}">${esc(lab)}${c.deja?" · encore une fois":""}</span>
    ${vues<2?guide("Lis la question et <b>réponds dans ta tête</b>. Puis appuie sur « Voir la réponse ».","pense"):""}
    <div class="carte-memo" id="carte"><p class="question">${esc(it.q)}</p><div id="verso" hidden><div class="retiens"><span class="retiens-titre">Réponse</span><b>${esc(it.o[0])}</b></div>${imageMemo(it)}<p>${esc(it.e)}</p>${astuce(it)?`<div class="astuce-memo avec-coco">${coco("pense","mini")}<p><b>Astuce :</b> ${esc(astuce(it))}</p></div>`:""}</div></div>
    <div class="bas-fixe"><div class="inner" id="actions"><button class="btn b-blue center" data-act="voir">Voir la réponse</button></div></div>`;
    window.scrollTo(0,0);
    app.querySelector('[data-act="quit"]').onclick=()=>{ if(confirm("Arrêter les cartes ? Ce que tu as fait est gardé.")) home(); };
    app.querySelector('[data-act="voir"]').onclick=()=>{
      $("#verso").hidden=false; $("#carte").classList.add("retournee");
      const bg=app.querySelector(".bulle-guide"); if(bg) bg.innerHTML="Alors, tu le savais ? Touche le <b>bon bouton</b> en bas. Dis la vérité, c’est pour t’aider !";
      setTimeout(()=>{ const v=$("#verso"); if(v) v.scrollIntoView({behavior:"smooth",block:"center"}); },60);
      $("#actions").innerHTML=`<div class="deux-boutons"><button class="btn b-coral center" data-act="non">Je ne savais pas</button><button class="btn b-mint center" data-act="oui">Je savais</button></div>`;
      app.querySelector('[data-act="oui"]').onclick=()=>{ record(it.id,true); if(!c.deja){ sues++; S.xp+=3; save(); } ding(); paquet.shift(); vues++; montrer(); };
      app.querySelector('[data-act="non"]').onclick=()=>{ record(it.id,false); paquet.shift(); if(!c.deja){ c.deja=true; paquet.splice(Math.min(4,paquet.length),0,c); } vues++; montrer(); };
    };
  };
  const finCartes=()=>{
    const ev=task?marquer(task):null;
    app.innerHTML=`<div class="fin">${mascotte(sues>=total*0.8?"fete":"content","grande saute")}<h2>${sues===total?"Tout est su !":"Cartes terminées !"}</h2><p class="score">${sues} / ${total}</p><p class="verdict">réponses que tu savais déjà. Celles que tu ne savais pas sont revenues une deuxième fois : c’est comme ça qu’on retient.</p></div>
    <div class="menu"><button class="btn b-mint center gros" data-act="suite">${!ev?"Retour à l’accueil":ev.session?"Terminer le bloc":"Continuer"}</button></div>`;
    window.scrollTo(0,0); if(sues>=total*0.8) confettis(40);
    app.querySelector('[data-act="suite"]').onclick=()=>ev?suiteApres(task,ev):home();
  };
  markDay(); montrer();
}

/* ---------- Dictée : écouter, écrire, comparer ---------- */
const normaliser=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[.,!?;:«»"]/g," ").replace(/\s+/g," ").trim();
function dictee(n,task){
  hush(); closePanel();
  if(!canSpeak){ if(!task) return home(); const ev=marquer(task); celebrer("Dictée","La voix n’est pas disponible sur ce téléphone : on passe à la suite."); return setTimeout(()=>suiteApres(task,ev),1500); }
  const liste=shuffle(DICTEES).slice(0,n); let k=0, justes=0;
  const montrer=()=>{
    if(k>=liste.length) return fin();
    const phrase=liste[k];
    app.innerHTML=`<div class="haut-jeu"><button class="fermer" data-act="quit" aria-label="Quitter">${ICO.x}</button><div class="jauge vert"><div style="width:${k/liste.length*100}%"></div></div><span class="chrono">${k+1}/${liste.length}</span></div>
    ${etiquetteTache(task)}<span class="etiquette" style="background:#8A4FE0">Dictée</span>
    ${k===0?guide("Appuie sur <b>Écouter</b>. Écris la phrase que tu entends, puis appuie sur « Vérifier »."):""}
    <p class="question">Écoute et écris la phrase.</p>
    <div class="ecoute"><button class="haut-parleur" data-act="play">${ICO.son}Écouter</button><button class="haut-parleur lent" data-act="slow">Plus lentement</button></div>
    <textarea id="dic" class="zone" rows="3" style="min-height:6rem;margin-top:1rem" placeholder="Écris ici…" autocapitalize="sentences" autocorrect="off" spellcheck="false"></textarea>
    <div id="res"></div>
    <div class="menu"><button class="btn b-mint center" data-act="check">Vérifier</button></div>`;
    window.scrollTo(0,0);
    app.querySelector('[data-act="quit"]').onclick=()=>{ hush(); if(confirm("Arrêter la dictée ?")) home(); };
    app.querySelector('[data-act="play"]').onclick=()=>speak(phrase,false);
    app.querySelector('[data-act="slow"]').onclick=()=>speak(phrase,true);

    app.querySelector('[data-act="check"]').onclick=function(){
      const tape=$("#dic").value; if(!tape.trim()){ $("#dic").focus(); return; }
      const a=normaliser(tape).split(" "), b=normaliser(phrase).split(" "), ok=a.join(" ")===b.join(" ");
      if(ok){ justes++; S.xp+=5; save(); ding(); confettis(25, innerWidth/2, innerHeight/2); }
      else oups();
      const diff=b.map((m,i)=>`<span class="${a[i]===m?"m-ok":"m-ko"}">${esc(m)}</span>`).join(" ");
      $("#res").innerHTML=`<div class="retour-dictee ${ok?"ok":"ko"}"><b>${ok?rnd(BRAVO):"Presque ! Regarde les mots en rouge :"}</b><p class="phrase-corr">${ok?esc(phrase):diff}</p>${ok?"":`<p>La phrase : <b>${esc(phrase)}</b></p>`}</div>`;
      this.textContent=k+1<liste.length?"Phrase suivante":"Terminer"; this.onclick=()=>{ hush(); k++; montrer(); };
    };
  };
  const fin=()=>{
    const ev=task?marquer(task):null;
    app.innerHTML=`<div class="fin">${mascotte(justes>=liste.length*0.7?"fete":"content","grande saute")}<h2>Dictée terminée !</h2><p class="score">${justes} / ${liste.length}</p><p class="verdict">${justes===liste.length?"Parfait, zéro faute !":"Chaque dictée améliore ton orthographe. Bravo pour l’effort !"}</p></div>
    <div class="menu"><button class="btn b-mint center gros" data-act="suite">${!ev?"Retour à l’accueil":ev.session?"Terminer le bloc":"Continuer"}</button></div>`;
    window.scrollTo(0,0);
    app.querySelector('[data-act="suite"]').onclick=()=>ev?suiteApres(task,ev):home();
  };
  markDay(); montrer();
}

/* ---------- Points faibles : le thème où elle réussit le moins ---------- */
function themeFaible(){
  let pire=null, score=2;
  for(const t in THEMES){ const vus=CIV.filter(x=>x.t===t && S.q[x.id]); const taux = vus.length<5 ? 0.6 : vus.filter(x=>S.q[x.id].last).length/vus.length; if(taux<score){ score=taux; pire=t; } }
  return pire||"val";
}

/* ---------- Rappels dans l’agenda du téléphone ---------- */
const pad=n=>String(n).padStart(2,"0");
const icsDate=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00";
function genererICS(debut){
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Objectif France//FR","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Objectif France"];
  for(let k=0;k<7;k++){ const dt=new Date(debut); dt.setDate(debut.getDate()+k); dt.setHours(9,30,0,0); const fin=new Date(dt.getTime()+15*60000);
    L.push("BEGIN:VEVENT","UID:objectif-france-jour"+(k+1)+"-"+icsDate(dt)+"@hajar","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z","DTSTART:"+icsDate(dt),"DTEND:"+icsDate(fin),"SUMMARY:Objectif France : ton programme du jour "+(k+1)+" t'attend","DESCRIPTION:Environ 4 heures de révision aujourd'hui, en 6 blocs, à ton rythme. Courage Hajar !","BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Ton programme du jour t'attend","TRIGGER:-PT0M","END:VALARM","END:VEVENT"); }
  L.push("END:VCALENDAR"); return L.join("\r\n");
}
function ajouterRappels(){
  const demain=new Date(); demain.setHours(0,0,0,0); demain.setDate(demain.getDate()+1);
  const blob=new Blob([genererICS(demain)],{type:"text/calendar"}), url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download="rappels-objectif-france.ics"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000);
}

/* ---------- Écrire et parler (comme au TCF IRN) ---------- */
const TACHES={
 ecrire:{titre:"Écrire",intro:"Au test, tu as 30 minutes pour 3 petits textes. Respecte le nombre de mots : c’est très important !",
   t:{1:"Un message court (30 à 60 mots)",2:"Raconter quelque chose (40 à 90 mots)",3:"Donner ton avis (40 à 90 mots)"}},
 parler:{titre:"Parler",intro:"Au test, tu parles 10 minutes avec un examinateur, sans préparation. Entraîne-toi à voix haute, seule ou avec ton mari !",
   t:{1:"Se présenter (3 min)",2:"Jeu de rôle (3 min 30)",3:"Donner ton avis (3 min 30)"}}
};
function choixTache(kind,b2){
  hush(); stopTimer(); closePanel(); G=null;
  const T=TACHES[kind];
  let h=`<div class="entete"><button class="fermer" data-act="back" aria-label="Retour">${ICO.x}</button><h2>${T.titre}${b2?" · niveau B2":""}</h2></div><p class="consigne" style="text-align:left">${b2?(kind==="ecrire"?"Au niveau B2, on attend des phrases plus riches : des arguments, des exemples et des mots de liaison (cependant, en revanche, par conséquent…). Le nombre de mots reste le même.":"Au niveau B2, on attend que tu développes tes idées, que tu donnes des arguments et que tu nuances ton avis."):T.intro}</p><div class="menu">`;
  [1,2,3].forEach(n=>h+=`<button class="btn ${["b-blue","b-purple","b-mint"][n-1]}" data-t="${n}"><span class="ico"><b style="font-family:var(--display);font-size:1.5rem">${n}</b></span><span><span class="big">Tâche ${n}</span><small>${T.t[n]}</small></span></button>`);
  h+=`</div>`;
  app.innerHTML=h; window.scrollTo(0,0); markDay();
  app.querySelector('[data-act="back"]').onclick=home;
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>kind==="ecrire"?ecrire(+b.dataset.t,null,b2):parler(+b.dataset.t,null,b2));
}
const compteMots=s=>s.trim()?s.trim().split(/\s+/).length:0;
function ecrire(n,task,b2){
  const sujet=rnd((b2?ECRIRE_B2:ECRIRE).filter(e=>e.t===n));
  let h=`<div class="entete"><button class="fermer" data-act="back" aria-label="Retour">${ICO.x}</button><h2>Écrire : tâche ${n}</h2></div>${etiquetteTache(task)}${guide("Lis le sujet, puis <b>écris ton texte</b> dans la case. Regarde bien le compteur de mots !")}
  <div class="carte-tache"><p class="enonce">${esc(sujet.c)}</p><p class="petit-titre">N’oublie pas de parler de :</p><ul>${sujet.idees.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>
  <textarea id="texte" class="zone" rows="8" placeholder="Écris ton texte ici…" autocapitalize="sentences"></textarea>
  <p class="compteur-mots" id="cpt">0 mot · il faut entre ${sujet.min} et ${sujet.max} mots</p>
  <div class="menu"><button class="btn b-mint center" data-act="fini">J’ai fini</button><button class="btn b-white center" data-act="ex">Voir un exemple</button><button class="btn b-white center" data-act="autre">Un autre sujet</button></div>
  <div id="exemple"></div>`;
  app.innerHTML=h; window.scrollTo(0,0);
  const ta=$("#texte"), cpt=$("#cpt");
  ta.oninput=()=>{ const m=compteMots(ta.value); const ok=m>=sujet.min&&m<=sujet.max; cpt.textContent=`${m} mot${m>1?"s":""} · il faut entre ${sujet.min} et ${sujet.max} mots`; cpt.className="compteur-mots "+(m===0?"":ok?"bon":"pasbon"); };
  app.querySelector('[data-act="back"]').onclick=()=>task?home():choixTache("ecrire",b2);
  app.querySelector('[data-act="autre"]').onclick=()=>ecrire(n,task,b2);
  app.querySelector('[data-act="ex"]').onclick=()=>{ $("#exemple").innerHTML=`<div class="carte-tache exemple"><p class="petit-titre">Exemple de réponse (${compteMots(sujet.ex)} mots)</p><p>${esc(sujet.ex)}</p></div>`; $("#exemple").scrollIntoView({behavior:"smooth",block:"start"}); };
  app.querySelector('[data-act="fini"]').onclick=()=>{
    const m=compteMots(ta.value);
    if(m<sujet.min){ flottant("Encore "+(sujet.min-m)+" mots !", innerWidth/2, cpt.getBoundingClientRect().top); oups(); return; }
    if(m>sujet.max){ flottant("Trop long de "+(m-sujet.max)+" mots", innerWidth/2, cpt.getBoundingClientRect().top); oups(); return; }
    S.xp+=20; save(); ding(); celebrer("Bravo !","Texte terminé, +20 points. Compare avec l’exemple pour t’améliorer.");
    $("#exemple").innerHTML=`<div class="carte-tache exemple"><p class="petit-titre">Compare avec cet exemple (${compteMots(sujet.ex)} mots)</p><p>${esc(sujet.ex)}</p></div>`;
    if(task) tacheFinieIci(task,$("#exemple"));
  };
}
let rec=null, recChunks=[], recUrl=null, parlerTimer=null;
function parler(n,task,b2){
  const P=(b2?PARLER_B2:PARLER)[n]; clearInterval(parlerTimer);
  const sujet = n===1 ? P.consigne : rnd(P.sujets);
  const canRec = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  let h=`<div class="entete"><button class="fermer" data-act="back" aria-label="Retour">${ICO.x}</button><h2>Parler : ${P.nom}</h2></div>${etiquetteTache(task)}${guide("Lis ce que dit l’examinateur et <b>réponds à voix haute</b>, comme au vrai test. Appuie sur « Je commence à parler ».")}
  <div class="carte-tache"><p class="petit-titre">L’examinateur te dit :</p><p class="enonce">« ${esc(sujet)} »</p>${canSpeak?`<button class="lire" data-act="ecouter">${ICO.son}Écouter</button>`:""}</div>
  ${n===1?`<div class="carte-tache"><p class="petit-titre">Il peut aussi te demander :</p><ul>${shuffle(P.questions).slice(0,4).map(q=>`<li>${esc(q)}</li>`).join("")}</ul></div>`:""}
  <div class="chrono-oral"><span id="temps">${fmtS(P.duree)}</span><button class="btn b-mint center" data-act="go">Je commence à parler</button></div>
  ${canRec?`<div class="menu"><button class="btn b-coral center" data-act="rec">Enregistrer ma voix</button><audio id="lecture" controls hidden></audio></div>`:""}
  <div class="carte-tache"><p class="petit-titre">Phrases utiles :</p><ul>${P.aide.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div>
  <div class="menu">${task?`<button class="btn b-mint center" data-act="finiparler">J’ai fini de parler</button>`:""}<button class="btn b-white center" data-act="autre">Un autre sujet</button></div><div id="suite-parler"></div>`;
  app.innerHTML=h; window.scrollTo(0,0);
  app.querySelector('[data-act="back"]').onclick=()=>{ clearInterval(parlerTimer); stopRec(); task?home():choixTache("parler",b2); };
  app.querySelector('[data-act="autre"]').onclick=()=>{ stopRec(); parler(n,task,b2); };
  const bfp=app.querySelector('[data-act="finiparler"]'); if(bfp) bfp.onclick=()=>{ clearInterval(parlerTimer); stopRec(); S.xp+=20; save(); ding(); celebrer("Bravo !","Entraînement à l’oral terminé, +20 points !"); tacheFinieIci(task,$("#suite-parler")); bfp.remove(); };
  const ec=app.querySelector('[data-act="ecouter"]'); if(ec) ec.onclick=()=>speak(sujet,false);

  app.querySelector('[data-act="go"]').onclick=function(){
    clearInterval(parlerTimer); let t=P.duree; this.textContent="Recommencer le chrono";
    $("#temps").textContent=fmtS(t);
    parlerTimer=setInterval(()=>{ t--; const el=$("#temps"); if(!el){ clearInterval(parlerTimer); return; } el.textContent=fmtS(Math.max(t,0));
      if(t<=0){ clearInterval(parlerTimer); stopRec(); S.xp+=20; save(); celebrer("Bravo !","Tu as parlé jusqu’au bout. +20 points !"); if(task){ tacheFinieIci(task,$("#suite-parler")); const b=app.querySelector('[data-act="finiparler"]'); if(b) b.remove(); } } },1000);
  };
  const br=app.querySelector('[data-act="rec"]');
  if(br) br.onclick=async()=>{
    if(rec && rec.state==="recording"){ stopRec(); return; }
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      recChunks=[]; rec=new MediaRecorder(stream);
      rec.ondataavailable=e=>{ if(e.data.size) recChunks.push(e.data); };
      rec.onstop=()=>{ stream.getTracks().forEach(t=>t.stop()); if(recUrl) URL.revokeObjectURL(recUrl); recUrl=URL.createObjectURL(new Blob(recChunks,{type:rec.mimeType||"audio/mp4"})); const a=$("#lecture"); if(a){ a.src=recUrl; a.hidden=false; } const b=app.querySelector('[data-act="rec"]'); if(b) b.textContent="Enregistrer à nouveau"; };
      rec.start(); br.textContent="Arrêter l’enregistrement";
    }catch(e){ br.textContent="Micro non autorisé"; br.disabled=true; }
  };
}
function stopRec(){ try{ if(rec && rec.state==="recording") rec.stop(); }catch(e){} }
const fmtS=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");

/* ---------- Défi 60 secondes ---------- */
function defiStart(w){
  const task=TACHE_EN_COURS; TACHE_EN_COURS=null;
  const pool=shuffle(WORLD[w].bank.filter(x=>x.k!=="o" && x.k!=="a"));
  G={task, lvl0:level(), w, defi:true, pool, i:0, score:0, end:Date.now()+60000, xp:0};
  markDay();
  timer=setInterval(()=>{ const left=G.end-Date.now(); const t=$(".temps div"); if(t) t.style.width=Math.max(0,left/600)+"%"; if(left<=0){ stopTimer(); defiFin(); } },250);
  defiShow();
}
function defiShow(){
  if(G.i>=G.pool.length){ G.pool=shuffle(G.pool); G.i=0; }
  const it=G.pool[G.i], opts=shuffle(it.o), [lab,col]=label(it);
  app.innerHTML=`<div class="haut-jeu"><button class="fermer" data-act="quit" aria-label="Quitter">${ICO.x}</button><div class="temps"><div style="width:${Math.max(0,(G.end-Date.now())/600)}%"></div></div><span class="points-defi">${G.score}</span></div>
  <span class="etiquette" style="background:${col}">${esc(lab)}</span><p class="question">${esc(it.q)}</p>
  <div class="options">${opts.map((o,j)=>`<button class="opt" data-opt="${j}">${esc(o)}</button>`).join("")}</div>`;
  app.querySelector('[data-act="quit"]').onclick=()=>{ stopTimer(); G.task?home():monde(G.w); };
  let locked=false;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(locked) return; locked=true;
    const good=opts[+b.dataset.opt]===it.o[0]; record(it.id,good);
    if(good){ G.score++; G.xp+=5; S.xp+=5; save(); b.classList.add("bonne","pop"); ding(); const r=b.getBoundingClientRect(); confettis(14, r.left+r.width/2, r.top+r.height/2); }
    else { oups(); b.classList.add("mauvaise","secoue"); app.querySelectorAll(".opt").forEach((x,k)=>{ if(opts[k]===it.o[0]) x.classList.add("bonne"); }); }
    setTimeout(()=>{ if(!G||!G.defi||Date.now()>=G.end) return; G.i++; defiShow(); }, good?350:900);
  });
}
function defiFin(){
  hush(); const w=G.w, key=w==="civ"?"civDefi":"frDefi", old=S.best[key], rec=G.score>old;

  ${G.task?`<div class="menu"><button class="btn b-mint center gros" data-act="suite">Continuer</button><button class="lien" data-act="again">Rejouer le défi</button></div>`:`<div class="menu"><button class="btn b-sun center" data-act="again">Rejouer</button><button class="btn b-white center" data-act="map">Retour au parcours</button></div>`}`;
  window.scrollTo(0,0);
  const gt=G.task; if(gt){ const ev=marquer(gt); app.querySelector('[data-act="suite"]').onclick=()=>suiteApres(gt,ev); }
  if(prize) setTimeout(()=>celebrer("Nouveau record !", prize.map(t=>NOMS[t]).join(" + "), prize),400);
  else if(rec && G.score>0) setTimeout(()=>celebrer("Nouveau record !", G.score+" bonnes réponses"),400);

  const bmap=app.querySelector('[data-act="map"]'); if(bmap) bmap.onclick=()=>monde(w);
}
