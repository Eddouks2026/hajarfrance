<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2D6CDF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Objectif France">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Objectif France</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23FFC93C'/%3E%3Ccircle cx='36' cy='44' r='6' fill='%23243B6B'/%3E%3Ccircle cx='64' cy='44' r='6' fill='%23243B6B'/%3E%3Cpath d='M32 62 Q50 78 68 62' stroke='%23243B6B' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF4FF; --surface:#FFFFFF; --ink:#1E2A47; --muted:#5D6B8A; --line:#D4E1F2;
  --blue:#2D6CDF; --blue-dark:#1F52B0; --purple:#8A4FE0; --purple-dark:#6C36BF;
  --sun:#FFC93C; --sun-dark:#E0A410; --coral:#FF6B6B; --coral-dark:#D94848;
  --mint:#22B573; --mint-dark:#168A55; --ok-bg:#DCF7E9; --ko-bg:#FFE3E3;
  --face:#243B6B;
  --font:"Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display:"Baloo 2", "Nunito", system-ui, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A2E; --surface:#1C2640; --ink:#EEF2FA; --muted:#A3B0CC; --line:#2C3A5C;
    --ok-bg:#143A2A; --ko-bg:#45202A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A2E; --surface:#1C2640; --ink:#EEF2FA; --muted:#A3B0CC; --line:#2C3A5C;
  --ok-bg:#143A2A; --ko-bg:#45202A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1.08rem;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
main{max-width:32rem;margin:0 auto;padding:1rem 1rem 10rem}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
h1,h2{font-family:var(--display);margin:0;line-height:1.1}

/* Boutons "3D" façon jeu */
.btn{display:flex;align-items:center;gap:.9rem;width:100%;text-align:left;border-radius:1.1rem;padding:1rem 1.1rem;color:#fff;font-weight:800;box-shadow:0 5px 0 var(--shadow);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
.btn .big{display:block;font-family:var(--display);font-size:1.5rem;line-height:1.1}
.btn small{display:block;font-weight:700;opacity:.92;font-size:.95rem}
.btn .ico{flex:none;width:3.2rem;height:3.2rem;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
.btn .ico svg{width:1.9rem;height:1.9rem}
.b-blue{background:var(--blue);--shadow:var(--blue-dark)}
.b-purple{background:var(--purple);--shadow:var(--purple-dark)}
.b-sun{background:var(--sun);--shadow:var(--sun-dark);color:#3A2A00}
.b-coral{background:var(--coral);--shadow:var(--coral-dark)}
.b-mint{background:var(--mint);--shadow:var(--mint-dark)}
.b-white{background:var(--surface);--shadow:var(--line);color:var(--ink);border:2px solid var(--line)}
.btn.center{justify-content:center;text-align:center;font-size:1.15rem}
.menu{display:grid;gap:1rem;margin-top:1.2rem}

/* Accueil */
.hello{display:flex;align-items:center;gap:.9rem;margin-top:1rem}
.mascotte{display:block;flex:none;object-fit:cover;border-radius:1.1rem;border:4px solid #fff;box-shadow:0 5px 0 var(--line)}
.mascotte.banniere{width:100%;aspect-ratio:2.3/1;object-position:50% 30%}
.mascotte.grande{width:min(17rem,85%);aspect-ratio:5/3;margin:0 auto}
.mascotte.humeur-fete{border-color:var(--sun);box-shadow:0 5px 0 var(--sun-dark)}
.mascotte.humeur-oups{border-color:var(--coral);box-shadow:0 5px 0 var(--coral-dark)}
.photo-accueil{display:block;width:100%;border-radius:1.3rem;border:4px solid #fff;box-shadow:0 6px 0 var(--line);aspect-ratio:760/603;object-fit:cover}
.hello h1{font-size:1.6rem}
.hello p{margin:.1rem 0 0;color:var(--muted);font-weight:700}
.niveau{background:var(--surface);border-radius:1.1rem;padding:.7rem 1rem;margin-top:.8rem;border:2px solid var(--line)}
.niveau-haut{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.niveau-haut .lvl{font-family:var(--display);font-size:1.3rem}
.jauge{height:14px;background:var(--line);border-radius:7px;overflow:hidden;margin-top:.45rem}
.jauge div{height:100%;border-radius:7px;background:var(--sun);transition:width .5s}
.jauge.vert div{background:var(--mint)}
.petits{display:flex;gap:.7rem;margin-top:.7rem}
.petit{flex:1;background:var(--surface);border:2px solid var(--line);border-radius:1rem;padding:.6rem .8rem;font-weight:700;color:var(--muted);font-size:.92rem}
.petit b{display:block;color:var(--ink);font-family:var(--display);font-size:1.45rem;line-height:1.1}

/* Choix du sujet */
.entete{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem}
.fermer{width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.fermer svg{width:1.6rem;height:1.6rem}
.entete h2{font-size:1.6rem}
.sujets{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:1rem}
.sujet{background:var(--surface);border:2px solid var(--line);border-radius:1rem;padding:.9rem .8rem;text-align:left;font-weight:800;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.sujet:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.sujet small{display:block;font-weight:700;color:var(--muted);margin-top:.25rem}
.pastille{display:block;width:2.2rem;height:.45rem;border-radius:.3rem;margin-bottom:.5rem}

/* Jeu */
.haut-jeu{display:flex;align-items:center;gap:.7rem;margin-bottom:1.2rem}
.haut-jeu .jauge{flex:1;margin:0}
.combo{font-weight:800;color:var(--sun-dark);min-width:4.2rem;text-align:right;font-family:var(--display);font-size:1.1rem}
.chrono{font-weight:800;font-variant-numeric:tabular-nums;min-width:3.6rem;text-align:right}
.etiquette{display:inline-block;font-weight:800;font-size:.9rem;padding:.2rem .7rem;border-radius:1rem;color:#fff;margin-bottom:.6rem}
.question{font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1.2;margin:0 0 .4rem}
.ecoute{display:flex;gap:.6rem;flex-wrap:wrap;margin:.8rem 0 .3rem}
.haut-parleur{display:flex;align-items:center;gap:.5rem;background:var(--blue);color:#fff;border-radius:1rem;padding:.7rem 1rem;font-weight:800;box-shadow:0 4px 0 var(--blue-dark)}
.haut-parleur.lent{background:var(--surface);color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.haut-parleur svg{width:1.4rem;height:1.4rem}
.haut-parleur:active{transform:translateY(3px);box-shadow:none}
.lire{color:var(--blue);font-weight:800;padding:.3rem 0;display:inline-flex;align-items:center;gap:.35rem}
.lire svg{width:1.15rem;height:1.15rem}
.options{display:grid;gap:.75rem;margin-top:1.1rem}
.opt{width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:1rem;padding:1rem 1.05rem;font-weight:700;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.choisie{border-color:var(--blue);background:#E3EDFF;box-shadow:0 4px 0 var(--blue)}
:root[data-theme="dark"] .opt.choisie{background:#22345F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt.choisie{background:#22345F}}
.opt.bonne{border-color:var(--mint);background:var(--ok-bg);box-shadow:0 4px 0 var(--mint)}
.opt.mauvaise{border-color:var(--coral);background:var(--ko-bg);box-shadow:0 4px 0 var(--coral)}
.opt:disabled{cursor:default;color:var(--ink)}
.secoue{animation:secoue .35s}
@keyframes secoue{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* Panneau du bas */
.panneau{position:fixed;left:0;right:0;bottom:0;padding:1rem 1rem calc(3.6rem + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease-out;z-index:5}
.panneau.ouvert{transform:none}
.panneau .inner{max-width:32rem;margin:0 auto}
.panneau.ok{background:var(--ok-bg)}
.panneau.ko{background:var(--ko-bg)}
.panneau .titre{font-family:var(--display);font-weight:800;font-size:1.5rem;margin:0}
.panneau.ok .titre{color:var(--mint-dark)}
.panneau.ko .titre{color:var(--coral-dark)}
:root[data-theme="dark"] .panneau.ok .titre{color:var(--mint)}
:root[data-theme="dark"] .panneau.ko .titre{color:var(--coral)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .panneau.ok .titre{color:var(--mint)} :root:not([data-theme="light"]) .panneau.ko .titre{color:var(--coral)}}
.panneau p{margin:.3rem 0 0}
.panneau .rep{font-weight:800}
.panneau .transcription{font-style:italic;color:var(--muted)}
.panneau .btn{margin-top:.9rem}
.bas-fixe{position:fixed;left:0;right:0;bottom:0;padding:1rem 1rem calc(3.6rem + env(safe-area-inset-bottom,0px));background:var(--bg)}
.bas-fixe .inner{max-width:32rem;margin:0 auto}
.btn:disabled{opacity:.45;cursor:default}

/* Fin */
.fin{text-align:center;margin-top:1rem}
.etoiles{display:flex;justify-content:center;gap:.4rem;margin:1rem 0 .3rem}
.etoiles svg{width:3.2rem;height:3.2rem}
.etoiles svg:nth-child(2){transform:translateY(-.6rem)}
.etoile-on{fill:var(--sun);stroke:var(--sun-dark)}
.etoile-off{fill:var(--line);stroke:var(--line)}
.fin h2{font-size:2rem}
.score{font-family:var(--display);font-weight:800;font-size:3.2rem;line-height:1;margin:.3rem 0}
.gain{display:inline-block;background:var(--sun);color:#3A2A00;font-weight:800;border-radius:1rem;padding:.3rem .9rem;margin-top:.3rem}
.verdict{color:var(--muted);font-weight:700;margin:.8rem 0 0}
.erreurs{text-align:left;margin-top:1.4rem;display:grid;gap:.6rem}
.erreurs h3{font-family:var(--display);margin:0 0 .2rem}
.erreur{background:var(--surface);border:2px solid var(--line);border-radius:1rem;padding:.75rem .9rem}
.erreur p{margin:0}
.erreur .rep{color:var(--mint-dark);font-weight:800;margin-top:.2rem}
:root[data-theme="dark"] .erreur .rep{color:var(--mint)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .erreur .rep{color:var(--mint)}}
.note{font-size:.85rem;color:var(--muted);text-align:center;margin-top:2rem}


/* Accueil : les deux examens */
.examens{display:grid;gap:1rem;margin-top:1.2rem}
.exam-btn{display:block;width:100%;text-align:left;border-radius:1.3rem;padding:1.1rem 1.2rem 1.2rem;color:#fff;box-shadow:0 6px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.exam-btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--shadow)}
.exam-btn .ligne{display:flex;align-items:center;gap:.8rem}
.exam-btn .ico{flex:none;width:3.2rem;height:3.2rem;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
.exam-btn .ico svg{width:1.9rem;height:1.9rem}
.exam-btn .big{display:block;font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1.05}
.exam-btn small{display:block;font-weight:700;opacity:.92}
.exam-btn .jauge{display:block;background:rgba(255,255,255,.3);margin-top:.9rem}
.exam-btn .jauge span{display:block;height:100%;border-radius:7px;background:#fff}

.exam-btn .etat{display:flex;justify-content:space-between;font-weight:800;font-size:.92rem;margin-top:.35rem}

/* Parcours */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:.2rem 0 1rem}
.mode{border-radius:1rem;padding:.75rem .8rem;text-align:left;font-weight:800;color:#fff;box-shadow:0 4px 0 var(--shadow)}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.mode small{display:block;font-weight:700;opacity:.92;font-size:.85rem}
.mode.large{grid-column:1/-1}
.consigne{color:var(--muted);font-weight:700;text-align:center;margin:.4rem 0 1rem}
.chemin{display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:.5rem 0 1rem}
.etape{display:flex;flex-direction:column;align-items:center;width:7.5rem}
.bulle{position:relative;padding:0;flex:none;width:4.6rem;height:4.6rem;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:1.6rem;box-shadow:0 6px 0 rgba(0,0,0,.22);transition:transform .08s}
.bulle:active{transform:translateY(4px)}
.bulle svg{width:1.7rem;height:1.7rem}
.bulle.verrou{background:var(--line)!important;color:var(--muted);box-shadow:0 6px 0 var(--line);cursor:default}
.bulle.actuelle{width:5.4rem;height:5.4rem;animation:respire 1.6s ease-in-out infinite}
@keyframes respire{50%{transform:scale(1.07)}}
.jouer{background:var(--surface);border:2px solid var(--line);border-radius:.8rem;padding:.1rem .6rem;font-weight:800;font-size:.85rem;margin-bottom:.35rem;color:var(--ink)}
.etape .nom{font-weight:800;font-size:.88rem;text-align:center;margin-top:.45rem;line-height:1.2}
.etape .mini{display:flex;gap:.1rem;margin-top:.15rem;height:1rem}
.etape .mini svg{width:1rem;height:1rem}
.trait{width:6px;height:1.4rem;border-radius:3px;background:var(--line)}

/* Phrase à reconstruire */
.phrase{align-items:center;min-height:3.6rem;border-bottom:3px dashed var(--line);display:flex;flex-wrap:wrap;gap:.45rem;padding:.5rem 0 .7rem;margin-top:1rem}
.mots{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem;min-height:3rem}
.mot{background:var(--surface);border:2px solid var(--line);border-radius:.8rem;padding:.5rem .8rem;font-weight:800;box-shadow:0 3px 0 var(--line)}
.mot:active{transform:translateY(2px);box-shadow:none}
.phrase .mot{border-color:var(--purple);box-shadow:0 3px 0 var(--purple)}
.phrase.bonne .mot{border-color:var(--mint);box-shadow:0 3px 0 var(--mint)}
.phrase.mauvaise .mot{border-color:var(--coral);box-shadow:0 3px 0 var(--coral)}
.verifier{margin-top:1.3rem}
.fin-phrase{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--muted)}

/* Défi éclair */
.temps{height:16px;border-radius:8px;background:var(--line);overflow:hidden;flex:1}
.temps div{height:100%;background:var(--sun);transition:width 1s linear}
.points-defi{font-family:var(--display);font-weight:800;font-size:1.4rem;min-width:2.5rem;text-align:right}
.flash-ok{animation:flashok .4s}
.flash-ko{animation:flashko .4s}
@keyframes flashok{0%{background:var(--ok-bg)}100%{background:transparent}}
@keyframes flashko{0%{background:var(--ko-bg)}100%{background:transparent}}

/* Bienvenue */
.bienvenue{text-align:center;padding-top:.5rem}
.bienvenue h1{font-size:2.2rem;margin-top:.8rem}
.bienvenue p{color:var(--muted);font-weight:700}
.champ{width:100%;font:inherit;font-weight:800;font-size:1.3rem;text-align:center;padding:.9rem;border-radius:1rem;border:2px solid var(--line);background:var(--surface);color:var(--ink);margin:1.2rem 0 .2rem}
.champ:focus{outline:3px solid var(--sun);outline-offset:2px}
.lien{color:var(--muted);font-weight:800;margin-top:.8rem;padding:.5rem}

/* Voix */
.bouton-voix{flex:none;display:flex;flex-direction:column;align-items:center;gap:.1rem;font-weight:800;font-size:.74rem;color:var(--blue);background:var(--surface);border:2px solid var(--line);border-radius:1rem;padding:.45rem .6rem}
.bouton-voix svg{width:1.4rem;height:1.4rem}
.liste-voix{display:grid;gap:.6rem}
.voix{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:1rem;padding:.8rem .9rem;box-shadow:0 4px 0 var(--line)}
.voix small{display:block;color:var(--muted);font-weight:700}
.voix .rond{flex:none;width:1.8rem;height:1.8rem;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:#fff}
.voix.choisie{border-color:var(--mint);box-shadow:0 4px 0 var(--mint)}
.voix.choisie .rond{background:var(--mint);border-color:var(--mint)}
.astuce{margin-top:1.4rem;background:var(--surface);border:2px dashed var(--line);border-radius:1rem;padding:.9rem 1rem}
.astuce p{margin:.4rem 0 0}
/* Musique et récompenses */
.boutons-haut{display:flex;gap:.45rem;flex:none}
.bouton-voix[hidden]{display:none}
.bouton-voix.off{color:var(--muted)}
.bouton-voix.off svg{opacity:.5}
.tresor{display:grid;grid-template-columns:1fr 1fr;gap:.35rem .6rem;background:var(--surface);border:2px solid var(--sun);border-radius:1rem;padding:.5rem .8rem;margin-top:.7rem;font-weight:700}
.tresor svg{width:2rem;height:2rem}
.tresor b{font-family:var(--display);font-size:1.25rem}
.tresor .tr{display:flex;align-items:center;gap:.4rem}
.tresor small{color:var(--muted);font-weight:700;margin-left:auto}
.tresor-vide{margin:.7rem 0 0;color:var(--muted);font-weight:700;font-size:.92rem;text-align:center}
.recompense{display:flex;gap:.9rem;align-items:center;text-align:left;background:var(--surface);border:3px solid var(--sun);border-radius:1.2rem;padding:.9rem 1rem;margin-top:1.2rem;box-shadow:0 5px 0 var(--sun-dark)}
.recompense .icones{display:flex;flex:none}
.recompense .icones svg{width:3.4rem;height:3.4rem}
.recompense .icones svg+svg{margin-left:-.7rem}
.recompense b{font-family:var(--display);font-size:1.35rem;display:block}
.recompense p{margin:.15rem 0 0;font-weight:700}
.levelup{display:table;margin:.6rem auto 0;background:var(--purple);color:#fff;font-weight:800;border-radius:1rem;padding:.3rem .9rem}
/* Confettis */
.confetti{position:fixed;top:40%;left:50%;width:10px;height:14px;border-radius:2px;pointer-events:none;z-index:9;animation:pluie 1s ease-out forwards}
@keyframes pluie{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.saute{animation:saute .5s}
@keyframes saute{30%{transform:translateY(-12px) scale(1.06)}60%{transform:translateY(0)}}

/* Préparation, bilan, écrire, parler */
.pret{background:var(--surface);border:2px solid var(--line);border-radius:1.1rem;padding:.75rem 1rem;margin-top:.8rem}
.pret-haut{display:flex;justify-content:space-between;align-items:baseline}
.pret-haut span{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--mint-dark)}
.pret .jauge div{background:linear-gradient(90deg,#22B573,#3FD0F5)}
.pret p{margin:.45rem 0 0;font-weight:700;color:var(--purple)}
.bilan{background:var(--surface);border:2px solid var(--line);border-radius:1.1rem;padding:.9rem 1rem;margin-top:1.2rem;text-align:left}
.bilan h3{font-family:var(--display);margin:0 0 .5rem}
.ligne-bilan{display:grid;grid-template-columns:1fr 5rem 2.6rem;gap:.5rem;align-items:center;font-weight:700;font-size:.92rem;margin:.35rem 0}
.barre-bilan{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.barre-bilan span{display:block;height:100%;border-radius:5px}
.ligne-bilan b{text-align:right}
.conseil{margin:.7rem 0 0;font-weight:700}
.carte-tache{background:var(--surface);border:2px solid var(--line);border-radius:1.1rem;padding:.9rem 1rem;margin-bottom:.9rem}
.carte-tache .enonce{font-weight:800;font-size:1.12rem;margin:0}
.carte-tache ul{margin:.3rem 0 0;padding-left:1.2rem}
.carte-tache li{margin:.15rem 0}
.carte-tache.exemple{border-color:var(--mint);margin-top:1rem}
.carte-tache.exemple p{margin:.3rem 0 0}
.petit-titre{font-weight:800;color:var(--muted);font-size:.9rem;margin:.6rem 0 0}
.carte-tache .petit-titre:first-child{margin-top:0}
.zone{width:100%;font:inherit;font-size:1.05rem;padding:.9rem;border-radius:1rem;border:2px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical;min-height:10rem}
.zone:focus{outline:3px solid var(--purple);outline-offset:1px}
.compteur-mots{font-weight:800;margin:.4rem 0 0;color:var(--muted)}
.compteur-mots.bon{color:var(--mint-dark)}
.compteur-mots.pasbon{color:var(--coral-dark)}
.chrono-oral{display:flex;align-items:center;gap:.9rem;margin:.3rem 0 1rem}
.chrono-oral span{font-family:var(--display);font-weight:800;font-size:2.4rem;min-width:5.2rem;font-variant-numeric:tabular-nums}
.chrono-oral .btn{flex:1}
audio{width:100%}


/* Aide à retenir */
.panneau{max-height:78vh;overflow-y:auto}
.retiens{background:var(--surface);border:3px dashed var(--mint);border-radius:1rem;padding:.6rem .8rem;margin:.5rem 0}
.retiens-titre{display:block;font-weight:800;font-size:.85rem;color:var(--mint-dark)}
.retiens b{display:block;font-family:var(--display);font-size:1.3rem;line-height:1.2;margin:.1rem 0}
.astuce-memo{background:#FFF4CC;color:#5A4300;border-radius:.8rem;padding:.55rem .75rem}
.deuxieme{font-weight:800;color:var(--purple)}
.retenues{display:table;margin:.6rem auto 0;background:var(--mint);color:#fff;font-weight:800;border-radius:1rem;padding:.3rem .9rem}


.alerte{background:#FFE3E3;color:#7A1F1F;border:2px solid var(--coral);border-radius:1rem;padding:.7rem .9rem;margin-top:.8rem;font-weight:700}
.alerte.douce{background:var(--surface);color:var(--ink);border-color:var(--sun);font-weight:600}
.alerte .lien{display:block;margin:.4rem 0 0;padding:0;color:var(--blue);font-weight:800}


/* Programme 7 jours */
.programme{background:var(--surface);border:3px solid var(--mint);border-radius:1.3rem;padding:1rem;margin-top:1rem;box-shadow:0 6px 0 var(--mint-dark)}
.prog-haut{display:flex;flex-direction:column;gap:.1rem;margin-bottom:.5rem}
.prog-jour{font-weight:800;color:var(--mint-dark);font-size:.95rem}
.prog-titre{font-family:var(--display);font-weight:800;font-size:1.45rem;line-height:1.1}
.programme .jauge div{background:linear-gradient(90deg,#22B573,#3FD0F5)}
.taches{list-style:none;padding:0;margin:.8rem 0;display:grid;gap:.35rem}
.taches li{display:flex;align-items:center;gap:.6rem;font-weight:700;padding:.45rem .5rem;border-radius:.7rem;cursor:pointer}
.taches li .coche{flex:none;width:1.6rem;height:1.6rem;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.85rem;color:#fff}
.taches li.ok{color:var(--muted);text-decoration:line-through}
.taches li.ok .coche{background:var(--mint);border-color:var(--mint)}
.taches li.cur{background:var(--ok-bg)}
.taches li.cur .coche{background:var(--sun);border-color:var(--sun);color:#3A2A00}
.objectif{margin-top:.9rem;font-size:.92rem;line-height:1.5}
.objectif span{display:inline-block;font-weight:800;padding:0 .4rem;border-radius:.4rem;color:#fff}
.objectif .bon{background:var(--mint)} b.bon{background:none;color:var(--mint-dark)}
.objectif .moyen{background:#FF8A00}.objectif .faible{background:var(--coral)}
.programme .lien{color:var(--blue);font-weight:800;padding:.6rem 0 0}
.jour-ligne{display:flex;gap:.5rem;align-items:baseline;padding:.3rem 0;border-top:1px solid var(--line);font-size:.92rem}
.jour-ligne span{margin-left:auto;font-weight:800;color:var(--muted)}
.jour-ligne.fini{color:var(--mint-dark)}
.fiche{display:grid;gap:.7rem;margin-top:1rem}
.point{display:flex;gap:.75rem;align-items:flex-start;background:var(--surface);border:2px solid var(--line);border-radius:1rem;padding:.8rem .9rem}
.point .num{flex:none;width:1.8rem;height:1.8rem;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:800}
.point p{margin:0}
.point b{color:var(--ink);background:linear-gradient(transparent 60%, rgba(255,201,60,.45) 60%)}


/* Carte de France dans le parcours */
.mini-carte{width:6.8rem;height:auto;margin-top:.3rem;display:block}
.mini-carte .terre{fill:#CFE3D4;stroke:#7FB394;stroke-width:1.2;stroke-linejoin:round}
.mini-carte .case{fill:#E8F1FB;stroke:#B8C9DE;stroke-width:.8}
.mini-carte .case.on{fill:#FFE3E3;stroke:#F2545B}
:root[data-theme="dark"] .mini-carte .terre{fill:#2E5A44;stroke:#4E8E6C}
:root[data-theme="dark"] .mini-carte .case{fill:#22304B;stroke:#3A4C70}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mini-carte .terre{fill:#2E5A44;stroke:#4E8E6C} :root:not([data-theme="light"]) .mini-carte .case{fill:#22304B;stroke:#3A4C70}}
.bulle{flex-direction:column}
.num-bulle{line-height:1}
.et-bulle{display:flex;gap:1px;font-size:.72rem;line-height:1;margin-top:.15rem}
.et-bulle i{font-style:normal;color:rgba(255,255,255,.4)}
.et-bulle i.on{color:#FFE27A;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.etape{width:9rem}
.etape .nom{max-width:9rem}


/* Accueil : aujourd’hui */
.aujourdhui{background:var(--surface);border:3px solid var(--mint);border-radius:1.3rem;padding:1rem;margin-top:1rem;box-shadow:0 6px 0 var(--mint-dark)}
.sessions{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;margin:.7rem 0 .2rem}
.chip-session{border:2px solid var(--line);border-radius:.9rem;padding:.45rem .3rem;background:var(--bg);display:flex;flex-direction:column;align-items:center;line-height:1.2}
.chip-session small{font-weight:700;color:var(--muted);font-size:.8rem}
.chip-session.fini{background:var(--ok-bg);border-color:var(--mint)}
.chip-session.fini small{color:var(--mint-dark)}
.chip-session.cur{background:#FFF4CC;border-color:var(--sun);box-shadow:0 3px 0 var(--sun-dark)}
:root[data-theme="dark"] .chip-session.cur{background:#3A3216}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip-session.cur{background:#3A3216}}
.session-box{margin-top:.8rem}
.session-titre{font-family:var(--display);font-weight:800;font-size:1.15rem;margin:0}
.rattrape{margin:.3rem 0 0;color:var(--purple);font-weight:700;font-size:.92rem}
.btn.gros{font-size:1.3rem;padding:1.1rem}
.cadeau-session{display:flex;align-items:center;gap:.4rem;justify-content:center;font-weight:700;color:var(--muted);margin:.7rem 0 0;font-size:.92rem}
.cadeau-session svg{width:1.6rem;height:1.6rem}
.ou-suis-je{margin:-.4rem 0 .5rem;font-weight:800;color:var(--mint-dark);font-size:.9rem}
.carte-bons{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;background:var(--surface);border:2px solid var(--sun);border-radius:1.1rem;padding:.75rem .9rem;margin-top:.9rem;box-shadow:0 4px 0 var(--sun-dark)}
.carte-bons .icones{display:flex}.carte-bons .icones svg{width:2.1rem;height:2.1rem}.carte-bons .icones svg+svg{margin-left:-.6rem}
.carte-bons b{display:block;font-family:var(--display);font-size:1.15rem}
.carte-bons small{color:var(--muted);font-weight:700}
.liste-bons{display:grid;gap:.6rem}
.bon{display:flex;align-items:center;gap:.7rem;background:var(--surface);border:2px dashed var(--sun);border-radius:1rem;padding:.7rem .8rem}
.bon svg{width:2.6rem;height:2.6rem;flex:none}
.bon div{flex:1}.bon b{display:block}.bon small{color:var(--muted);font-weight:700}
.bon .btn{width:auto;padding:.55rem .8rem;font-size:.95rem}
.bon.utilise{opacity:.55;border-style:solid;border-color:var(--line)}
.rappels{display:flex;align-items:center;gap:.8rem;margin-top:.9rem;text-align:left}
.rappels small{display:block;font-weight:700;color:var(--muted)}
.ico-rappel svg{width:1.8rem;height:1.8rem;color:var(--blue)}
details.libre{margin-top:1.2rem;background:var(--surface);border:2px solid var(--line);border-radius:1.1rem;padding:.2rem 1rem .9rem}
details.libre summary{font-family:var(--display);font-weight:800;font-size:1.2rem;padding:.7rem 0;cursor:pointer;list-style:none}
details.libre summary::after{content:" +";color:var(--blue)}
details.libre[open] summary::after{content:" −"}
details.libre summary::-webkit-details-marker{display:none}


/* Cartes mémoire, dictée, 5 sessions */
.sessions{grid-template-columns:repeat(5,1fr);gap:.3rem}
.chip-session{padding:.4rem .1rem}
.chip-session b{font-size:.9rem;white-space:nowrap}
.chip-session small{font-size:.72rem;min-height:1em}
.carte-memo{background:var(--surface);border:3px solid var(--line);border-radius:1.3rem;padding:1.2rem 1.1rem;min-height:12rem;box-shadow:0 6px 0 var(--line);transition:transform .3s}
.carte-memo.retournee{border-color:var(--mint);box-shadow:0 6px 0 var(--mint)}
.deux-boutons{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;width:calc(100% - 4.8rem)}
.bas-fixe .deux-boutons .btn{width:100%;font-size:1rem;padding:.95rem .5rem}
.retour-dictee{border-radius:1rem;padding:.8rem 1rem;margin-top:.8rem}
.retour-dictee.ok{background:var(--ok-bg)}.retour-dictee.ko{background:var(--ko-bg)}
.retour-dictee p{margin:.3rem 0 0}
.phrase-corr{font-size:1.15rem;font-weight:700}
.m-ok{color:var(--mint-dark)}
.m-ko{color:var(--coral-dark);text-decoration:underline wavy;text-underline-offset:3px}


.consigne-jour{margin:.5rem 0 .2rem;font-weight:700;color:var(--muted);font-size:.93rem}
.session-sous{margin:.15rem 0 0;color:var(--muted);font-weight:700;font-size:.92rem}
.sessions{grid-template-columns:repeat(6,1fr)}
.chip-session b{font-size:1.15rem}
.temps-jour{background:var(--surface);border:2px solid var(--line);border-radius:1.1rem;padding:.75rem 1rem;margin-top:.9rem}
.temps-jour .jauge div{background:linear-gradient(90deg,#8A4FE0,#E056A0)}
.temps-jour p{margin:.45rem 0 0;font-weight:700;color:var(--purple);font-size:.92rem}
.bonus{display:grid;gap:.5rem;margin-top:.6rem}
.bonus .btn{font-size:1rem;padding:.75rem .9rem;justify-content:flex-start}

/* ===== Version plus joyeuse ===== */
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 8% 6%, rgba(255,201,60,.35) 0 5.5rem, transparent 5.6rem),
    radial-gradient(circle at 96% 14%, rgba(255,143,208,.32) 0 4.5rem, transparent 4.6rem),
    radial-gradient(circle at 92% 82%, rgba(63,208,245,.28) 0 6.5rem, transparent 6.6rem),
    radial-gradient(circle at 4% 64%, rgba(34,181,115,.22) 0 4rem, transparent 4.1rem),
    linear-gradient(180deg, #E6F3FF 0%, #FFF1F8 100%);
  background-attachment:fixed;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body{ background-image:radial-gradient(circle at 8% 6%, rgba(255,201,60,.14) 0 5.5rem, transparent 5.6rem),radial-gradient(circle at 96% 14%, rgba(255,143,208,.14) 0 4.5rem, transparent 4.6rem),radial-gradient(circle at 92% 82%, rgba(63,208,245,.12) 0 6.5rem, transparent 6.6rem),linear-gradient(180deg,#121A2E 0%,#1E1530 100%);} }
:root[data-theme="dark"] body{ background-image:linear-gradient(180deg,#121A2E 0%,#1E1530 100%); }
.exam-btn.b-blue{background:linear-gradient(135deg,#2D6CDF 0%,#3FA9F5 100%)}
.exam-btn.b-purple{background:linear-gradient(135deg,#8A4FE0 0%,#E056A0 100%)}
.exam-btn .ico{background:rgba(255,255,255,.28)}
.mode.b-sun{background:linear-gradient(135deg,#FFC93C,#FFA23C)}
.mode.b-blue{background:linear-gradient(135deg,#2D6CDF,#3FA9F5)}
.mode.b-coral{background:linear-gradient(135deg,#FF6B6B,#FF8FB1)}
.btn.b-mint{background:linear-gradient(135deg,#22B573,#3DD68C)}
.btn.b-coral{background:linear-gradient(135deg,#FF6B6B,#FF8FB1)}
.bulle::after{content:"";position:absolute;top:13%;left:24%;width:30%;height:20%;border-radius:50%;background:rgba(255,255,255,.38);pointer-events:none}
.bulle.verrou::after{display:none}
.etiquette{box-shadow:0 3px 0 rgba(0,0,0,.15)}
.niveau .jauge div{background:linear-gradient(90deg,#FFC93C,#FF8FB1)}
.jauge.vert div{background:linear-gradient(90deg,#22B573,#3FD0F5)}
.opt.pop{animation:popopt .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes popopt{40%{transform:scale(1.05)}}
.confetti.rond,.pluie.rond{border-radius:50%;width:10px;height:10px}

/* Boutons du bas : à gauche, loin de la petite fenêtre de l’hébergeur */
.panneau{padding-bottom:calc(1.2rem + env(safe-area-inset-bottom,0px))}
.bas-fixe{padding-bottom:calc(1.2rem + env(safe-area-inset-bottom,0px))}
.panneau .btn,.bas-fixe .btn{width:calc(100% - 4.8rem);margin-right:auto;font-size:1.2rem;padding:1.05rem 1rem}

/* Étoiles qui apparaissent une par une */
.etoiles svg.etoile-on{animation:popstar .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes popstar{0%{transform:scale(0) rotate(-60deg)}100%{transform:scale(1) rotate(0)}}
.etoiles svg:nth-child(2).etoile-on{animation-name:popstar2}
@keyframes popstar2{0%{transform:translateY(-.6rem) scale(0) rotate(-60deg)}100%{transform:translateY(-.6rem) scale(1)}}

/* Texte qui s’envole */
.flottant{position:fixed;z-index:9;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:1.7rem;color:#FF8A00;text-shadow:0 2px 0 #fff,0 0 12px rgba(255,201,60,.8);pointer-events:none;animation:monte 1.1s ease-out forwards;white-space:nowrap}
@keyframes monte{to{transform:translate(-50%,-140%) scale(1.2);opacity:0}}

/* Pluie de confettis */
.pluie{position:fixed;top:-20px;width:10px;height:15px;border-radius:2px;z-index:31;pointer-events:none;animation:tombe var(--d) linear var(--delay) forwards}
@keyframes tombe{to{transform:translate(var(--x),112vh) rotate(var(--r))}}

/* Grand écran de fête */
.fete{position:fixed;inset:0;z-index:30;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 45%, #8A4FE0, #2A1660);animation:apparait .25s ease-out;cursor:pointer;padding:1.5rem}
.fete.part{animation:disparait .3s ease-in forwards}
@keyframes apparait{from{opacity:0}}
@keyframes disparait{to{opacity:0}}
.fete .rayons{position:absolute;left:50%;top:45%;width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;border-radius:50%;background:repeating-conic-gradient(rgba(255,201,60,.28) 0 9deg, transparent 9deg 18deg);animation:tourne 14s linear infinite;-webkit-mask:radial-gradient(circle, #000 0 30%, transparent 62%);mask:radial-gradient(circle, #000 0 30%, transparent 62%)}
@keyframes tourne{to{transform:rotate(360deg)}}
.fete .carte{position:relative;text-align:center;color:#fff;animation:boum .7s cubic-bezier(.2,1.7,.4,1)}
@keyframes boum{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.fete .icones{display:flex;justify-content:center;gap:.3rem;margin-bottom:.6rem}
.fete .icones svg{width:5.2rem;height:5.2rem;filter:drop-shadow(0 6px 0 rgba(0,0,0,.2));animation:danse 1.2s ease-in-out infinite}
.fete .icones svg:nth-child(2){animation-delay:.2s}.fete .icones svg:nth-child(3){animation-delay:.4s}
@keyframes danse{50%{transform:translateY(-10px) rotate(6deg)}}
.fete .gros{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,13vw,4.2rem);line-height:1;color:#FFE27A;text-shadow:0 5px 0 #E0A410,0 10px 24px rgba(0,0,0,.35)}
.fete .sous{font-weight:800;font-size:1.25rem;margin-top:.7rem;max-width:20rem}
.fete .tap{margin-top:1.6rem;font-weight:700;font-size:.92rem;opacity:.75}
@media (prefers-reduced-motion: reduce){.fete .rayons{display:none}}


/* Encouragements */
#app > *{animation:entree .28s ease-out both}
@keyframes entree{from{opacity:0;transform:translateY(8px)}}
.toast{position:fixed;top:calc(1rem + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:40;background:var(--purple);color:#fff;font-weight:800;padding:.6rem 1.1rem;border-radius:2rem;box-shadow:0 6px 18px rgba(0,0,0,.2);animation:toastin .3s ease-out;white-space:nowrap}
.toast.part{opacity:0;transition:opacity .4s}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-12px)}}
.bonjour{position:fixed;inset:0;z-index:35;background:rgba(30,20,70,.55);display:grid;place-items:center;padding:1.2rem;animation:apparait .25s ease-out}
.bonjour.part{animation:disparait .25s ease-in forwards}
.carte-bonjour{background:var(--surface);border-radius:1.4rem;padding:1.2rem;max-width:24rem;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:boum .5s cubic-bezier(.2,1.5,.4,1)}
.photo-bonjour{width:100%;aspect-ratio:2.3/1;object-fit:cover;border-radius:1rem;border:3px solid var(--sun)}
.carte-bonjour h2{font-size:1.8rem;margin:.6rem 0 .2rem}
.carte-bonjour p{margin:.4rem 0}
.bilan-hier{background:var(--ok-bg);border-radius:.8rem;padding:.5rem .7rem}
.mot-jour{font-style:italic;color:var(--purple);font-weight:700}
.carte-bonjour .btn{margin-top:.8rem}
.progres{background:var(--surface);border:2px solid var(--line);border-radius:1.1rem;padding:.75rem 1rem;margin-top:.9rem}
.progres .jauge div{background:linear-gradient(90deg,#2D6CDF,#3FD0F5)}
.progres .petits{margin-top:.7rem}
.progres .petit{padding:.45rem .55rem;font-size:.82rem}
.progres .petit b{font-size:1.25rem}
.bilan-jour{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.9rem}
.bilan-jour div{background:var(--surface);border:2px solid var(--line);border-radius:.9rem;padding:.5rem;font-weight:700;color:var(--muted);font-size:.85rem}
.bilan-jour b{display:block;font-family:var(--display);font-size:1.35rem;color:var(--ink)}
/* Erreur : ton plus doux (orange chaleureux plutôt que rouge) */
:root{--ko-bg:#FFF1DE}
.panneau.ko .titre{color:#C85F00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ko-bg:#3D2A14} :root:not([data-theme="light"]) .panneau.ko .titre{color:#FFB46B}}
:root[data-theme="dark"]{--ko-bg:#3D2A14}


/* Carte : Rennes et plus grand */
.mini-carte{width:9.5rem!important}
.etape{width:11rem!important}
.etape .nom{max-width:11rem!important}
.mini-carte .trajet{stroke:#F2545B;stroke-width:1.2;stroke-dasharray:3 2.5;opacity:.7}
.mini-carte .nom-rennes{font-size:7px;font-weight:800;fill:#2D6CDF;text-anchor:middle;font-family:var(--font)}
.distance{display:block;font-weight:800;font-size:.8rem;color:var(--blue);margin-top:.15rem}
/* Tableau de bord */
.tableau{background:var(--surface);border:3px solid var(--mint);border-radius:1.4rem;padding:1rem;margin-top:1rem;box-shadow:0 6px 0 var(--mint-dark)}
.tableau.fini{text-align:center;border-color:var(--sun);box-shadow:0 6px 0 var(--sun-dark)}
.trophee svg{width:5rem;height:5rem;animation:danse 1.4s ease-in-out infinite}
.tb-sur{margin:0 0 .7rem;font-weight:700;color:var(--muted)}
.tb-haut{display:flex;align-items:center;gap:.9rem}
.anneau{--p:0;flex:none;width:5.2rem;height:5.2rem;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--mint) calc(var(--p)*1%), var(--line) 0)}
.anneau span{width:4rem;height:4rem;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;color:var(--muted);font-size:.9rem}
.anneau span b{font-family:var(--display);font-size:1.5rem;color:var(--ink);line-height:1}
.tb-titre{font-family:var(--display);font-size:1.35rem;line-height:1.15;margin:.1rem 0}
.tb-info{margin:.1rem 0 0;color:var(--muted);font-weight:700;font-size:.92rem}
.tb-cadeau{display:flex;align-items:center;gap:.4rem;font-weight:800;color:var(--coral-dark);margin:.8rem 0 .2rem;font-size:.92rem}
.mini-cadeau{width:1.5rem;height:1.5rem;animation:danse 1.6s ease-in-out infinite}
.detail-mission{margin-top:.7rem}
.detail-mission summary{cursor:pointer;font-weight:800;color:var(--blue);padding:.3rem 0}
.liste-missions{display:grid;gap:.4rem;margin-top:.9rem;border-top:2px dashed var(--line);padding-top:.8rem}
.ligne-mission{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:.9rem;padding:.5rem .7rem}
.ligne-mission .ico-m{flex:none;width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--blue);font-weight:800}
.ligne-mission .ico-m svg{width:1.2rem;height:1.2rem}
.ligne-mission .txt-m{flex:1;line-height:1.2}
.ligne-mission .txt-m small{display:block;color:var(--muted);font-weight:700}
.ligne-mission .etat-m{font-weight:800;font-size:.85rem;color:var(--muted)}
.ligne-mission.fini{background:var(--ok-bg);border-color:var(--mint)}
.ligne-mission.fini .ico-m{background:var(--mint);color:#fff}
.ligne-mission.fini .etat-m{color:var(--mint-dark)}
.ligne-mission.cur{background:#FFF4CC;border-color:var(--sun)}
.ligne-mission.cur .etat-m{color:#9A6B00}
:root[data-theme="dark"] .ligne-mission.cur{background:#3A3216}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ligne-mission.cur{background:#3A3216}}
.aide{margin:.7rem 0 0;font-size:.9rem;color:var(--muted);font-weight:600}
.semaine{background:var(--surface);border:2px solid var(--line);border-radius:1.1rem;padding:.8rem 1rem;margin-top:.9rem}
.etapes7{display:grid;grid-template-columns:repeat(7,1fr);gap:.2rem;margin-top:.5rem;text-align:center}
.e7 span{display:grid;place-items:center;width:2rem;height:2rem;margin:0 auto;border-radius:50%;border:2px solid var(--line);font-weight:800;background:var(--bg)}
.e7 small{display:block;font-size:.62rem;font-weight:700;color:var(--muted);line-height:1.1;margin-top:.2rem}
.e7.fini span{background:var(--mint);border-color:var(--mint);color:#fff}
.e7.cur span{background:var(--sun);border-color:var(--sun-dark);color:#3A2A00;transform:scale(1.12)}
.note-ex{display:inline-block;font-weight:800;padding:0 .35rem;border-radius:.4rem;color:#fff}
.note-ex.bon{background:var(--mint)}.note-ex.moyen{background:#FF8A00}.note-ex.faible{background:var(--coral)}
.zone-danger{border-color:var(--coral)!important}
.zone-reset{border:3px solid var(--coral);border-style:solid;margin-top:.2rem}
/* Cadeau à ouvrir */
.ecran-cadeau{position:fixed;inset:0;z-index:32;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 45%, #8A4FE0, #2A1660);animation:apparait .25s ease-out;padding:1.5rem;text-align:center;color:#fff}
.ecran-cadeau.part{animation:disparait .3s ease-in forwards}
.ecran-cadeau .rayons{position:absolute;left:50%;top:45%;width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;border-radius:50%;background:repeating-conic-gradient(rgba(255,201,60,.28) 0 9deg, transparent 9deg 18deg);animation:tourne 14s linear infinite;-webkit-mask:radial-gradient(circle, #000 0 30%, transparent 62%);mask:radial-gradient(circle, #000 0 30%, transparent 62%)}
.ecran-cadeau .contenu{position:relative;z-index:2;animation:boum .6s cubic-bezier(.2,1.7,.4,1);max-width:22rem}
.ecran-cadeau .gros{font-family:var(--display);font-weight:800;font-size:clamp(2.3rem,11vw,3.6rem);line-height:1.05;color:#FFE27A;text-shadow:0 5px 0 #E0A410,0 10px 24px rgba(0,0,0,.35)}
.ecran-cadeau .sous{font-weight:800;font-size:1.15rem;margin-top:.6rem}
.ecran-cadeau .tap{font-weight:700;opacity:.85;margin-top:.6rem}
.cadeau-btn{display:block;margin:1.2rem auto 0;width:10rem;height:10rem;animation:sautille 1.1s ease-in-out infinite}
.cadeau-btn .boite{width:100%;height:100%;filter:drop-shadow(0 8px 0 rgba(0,0,0,.25))}
@keyframes sautille{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-12px) rotate(-4deg)}60%{transform:translateY(0) rotate(4deg)}}
.cadeau-btn.ouvre{animation:secoueFort .6s ease-in-out}
.cadeau-btn.ouvre .couvercle{transition:transform .5s cubic-bezier(.3,1.6,.5,1) .3s;transform:translate(10px,-60px) rotate(25deg);transform-origin:60px 45px}
@keyframes secoueFort{20%{transform:rotate(-10deg) scale(1.05)}40%{transform:rotate(10deg) scale(1.1)}60%{transform:rotate(-8deg) scale(1.12)}80%{transform:rotate(6deg) scale(1.15)}}
.ecran-cadeau .icones.revele{display:flex;justify-content:center;gap:.3rem;margin:1rem 0 .4rem}
.ecran-cadeau .icones.revele svg{width:6rem;height:6rem;animation:revele .7s cubic-bezier(.2,1.8,.4,1) both, danse 1.4s ease-in-out .7s infinite;filter:drop-shadow(0 6px 0 rgba(0,0,0,.2))}
@keyframes revele{from{transform:scale(0) rotate(-180deg)}}
.ecran-cadeau .btn{margin-top:1.2rem}
.feux{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}


/* ===== Accueil façon jeu ===== */
.accueil-haut{position:relative}
.mascotte.banniere-petite{width:100%;aspect-ratio:2.6/1;object-position:50% 30%}
.rond-reglage{position:absolute;top:.5rem;right:.5rem;width:2.8rem;height:2.8rem;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--blue);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.rond-reglage svg{width:1.5rem;height:1.5rem}
.bonjour-titre{font-size:2.1rem;margin:.8rem 0 0;text-align:center}
.sous-bonjour{text-align:center;margin:.15rem 0 0;color:var(--muted);font-weight:700}
.carte-mission{position:relative;overflow:hidden;margin-top:1rem;border-radius:1.8rem;padding:1.1rem 1.1rem 1.2rem;color:#fff;text-align:center;background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 8px 0 rgba(0,0,0,.18),0 14px 30px rgba(0,0,0,.12)}
.carte-mission::before,.carte-mission::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.carte-mission::before{width:11rem;height:11rem;top:-4rem;right:-3rem}
.carte-mission::after{width:7rem;height:7rem;bottom:-2.5rem;left:-2rem}
.mission-tete{position:relative;display:inline-block;background:rgba(255,255,255,.25);font-weight:800;border-radius:2rem;padding:.3rem .9rem;font-size:.92rem}
.mission-illu{position:relative;width:7rem;height:7rem;margin:.9rem auto .4rem;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;animation:flotte 3s ease-in-out infinite}
.mission-illu svg{width:4.4rem;height:4.4rem;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
@keyframes flotte{50%{transform:translateY(-6px)}}
.carte-mission h2{position:relative;font-size:1.85rem;margin:.2rem 0 .3rem;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.mission-programme{position:relative;margin:0 auto;font-weight:700;max-width:22rem;line-height:1.4}
.mission-duree{position:relative;margin:.5rem 0 0;font-weight:800;opacity:.92}
.btn-jouer{position:relative;display:block;width:100%;margin-top:1rem;background:#fff;color:var(--ink);font-family:var(--display);font-weight:800;font-size:1.6rem;border-radius:1.2rem;padding:.85rem;box-shadow:0 6px 0 rgba(0,0,0,.2);animation:respire 2s ease-in-out infinite}
.btn-jouer:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2);animation:none}
.mission-cadeau{position:relative;display:flex;align-items:center;justify-content:center;gap:.45rem;margin-top:.9rem;font-weight:800}
.mission-cadeau .mini-cadeau{width:1.9rem;height:1.9rem;background:#fff;border-radius:.6rem;padding:.2rem}
.lien-blanc{position:relative;display:block;margin:.8rem auto 0;color:#fff;font-weight:800;text-decoration:underline}
.etoiles-jour{text-align:center;margin-top:1rem}
.etoiles-jour .rangee{display:flex;justify-content:center;gap:.35rem}
.etoiles-jour .et svg{width:2.4rem;height:2.4rem;fill:var(--line);stroke:var(--line)}
.etoiles-jour .et.on svg{fill:#FFC93C;stroke:#E0A410}
.etoiles-jour .et.cur svg{fill:#FFF0B8;stroke:#FFC93C;animation:respire 1.6s ease-in-out infinite}
.etoiles-jour p{margin:.4rem 0 0;color:var(--muted);font-weight:700}
.trois-boutons{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:1.3rem}
.gros-rond{display:flex;flex-direction:column;align-items:center;gap:.4rem;font-weight:800;font-size:.92rem}
.gros-rond .cercle{position:relative;width:4.4rem;height:4.4rem;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.gros-rond .cercle svg{width:2.1rem;height:2.1rem}
.gros-rond .cercle .mini-cadeau{background:#fff;border-radius:.6rem;padding:.2rem;width:2.4rem;height:2.4rem}
.gros-rond:active .cercle{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.pastille-nb{position:absolute;top:-.2rem;right:-.2rem;min-width:1.5rem;height:1.5rem;border-radius:1rem;background:var(--sun);color:#3A2A00;font-style:normal;font-weight:800;font-size:.85rem;display:grid;place-items:center;padding:0 .3rem;border:2px solid #fff}
.mondes{display:grid;gap:.55rem;margin:1rem 0}
.monde{display:flex;align-items:center;gap:.8rem;background:var(--surface);border:2px solid var(--line);border-radius:1.1rem;padding:.6rem .8rem}
.monde .num-monde{flex:none;width:2.8rem;height:2.8rem;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.3rem;color:#fff;background:linear-gradient(150deg,var(--c1),var(--c2))}
.monde small{display:block;color:var(--muted);font-weight:700}
.monde.fini{opacity:.8}.monde.fini .num-monde{background:var(--mint)}
.monde.cur{border-color:var(--sun);box-shadow:0 4px 0 var(--sun-dark);background:#FFF8DC}
:root[data-theme="dark"] .monde.cur{background:#3A3216}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .monde.cur{background:#3A3216}}
.monde.final{border-style:dashed}
.monde.final .num-monde{background:linear-gradient(150deg,#FFB020,#FFC93C)}
.monde.final .num-monde svg{width:1.8rem;height:1.8rem}


/* Coco le guide */
.guide{display:flex;align-items:flex-end;gap:.5rem;margin:.6rem 0 .8rem}
.guide .coco{flex:none;width:3.6rem;height:3.6rem;animation:flotte 2.6s ease-in-out infinite}
.bulle-guide{position:relative;margin:0;background:var(--surface);border:2px solid var(--sun);border-radius:1.1rem 1.1rem 1.1rem .3rem;padding:.55rem .8rem;font-weight:700;font-size:.98rem;box-shadow:0 3px 0 var(--sun-dark);flex:1}
.bulle-guide b{color:var(--blue)}
/* Bouton Jouer : jaune, joyeux */
.btn-jouer{display:flex!important;align-items:center;justify-content:center;gap:.5rem;background:linear-gradient(180deg,#FFE066,#FFB703)!important;color:#5A3A00!important;box-shadow:0 7px 0 #C98600, 0 12px 20px rgba(0,0,0,.18)!important;font-size:1.9rem!important;border:3px solid #fff}
.btn-jouer svg{width:1.6rem;height:1.6rem}
.btn-jouer:active{box-shadow:0 2px 0 #C98600!important}
/* Frise */
.frise-ligne{display:grid;gap:.45rem;margin:.8rem 0;padding:.7rem;border:2px dashed var(--line);border-radius:1rem;min-height:4rem}
.frise-pose{display:flex;align-items:center;gap:.6rem;background:var(--surface);border:2px solid var(--sun);border-radius:.9rem;padding:.5rem .7rem;font-weight:700}
.frise-pose span{flex:none;min-width:2rem;height:2rem;padding:0 .4rem;border-radius:1rem;background:var(--sun);color:#3A2A00;display:grid;place-items:center;font-weight:800}
.frise-pose.ok{border-color:var(--mint)}.frise-pose.ok span{background:var(--mint);color:#fff}
.haut-parleur{animation:respire 1.8s ease-in-out infinite}
.haut-parleur.lent{animation:none}


/* Accueil compact */
.accueil-ligne{display:flex;align-items:center;gap:.7rem}
.medaillon{flex:none;width:6.2rem;height:3.7rem;border-radius:1rem;object-fit:cover;object-position:50% 30%;border:3px solid var(--sun);box-shadow:0 3px 0 var(--sun-dark)}
.accueil-txt{flex:1;min-width:0}
.accueil-ligne .bonjour-titre{font-size:1.6rem;margin:0;text-align:left}
.accueil-ligne .sous-bonjour{text-align:left;font-size:.9rem;margin:0}
.accueil-ligne .rond-reglage{position:static;flex:none;background:var(--surface);border:2px solid var(--line);width:auto;height:auto;border-radius:1rem;padding:.35rem .5rem;display:flex;flex-direction:column;align-items:center;gap:.05rem;font-weight:800;font-size:.68rem}
.carte-mission{margin-top:.2rem;padding:.9rem 1rem 1rem}
.mission-illu{width:5rem;height:5rem;margin:.6rem auto .3rem}
.mission-illu svg{width:3.2rem;height:3.2rem}
.carte-mission h2{font-size:1.55rem;margin:.1rem 0 .2rem}
.mission-programme{font-size:.95rem;line-height:1.3}
.mission-duree{margin:.3rem 0 0;font-size:.95rem}
.btn-jouer{margin-top:.7rem;padding:.7rem!important}
.mission-cadeau{margin-top:.7rem;font-size:.92rem}
.guide{margin:.5rem 0 .6rem}
.btn-jouer.petit{font-size:1.25rem!important}
.accueil-ligne .bonjour-titre{font-size:1.45rem}


/* Coco en images */
img.coco{flex:none;width:4.2rem;height:4.2rem;border-radius:50%;object-fit:cover;background:#F7F4EE;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.12)}
img.coco.mini{width:2.6rem;height:2.6rem;animation:none;border-width:2px}
img.coco.moyen{display:block;width:8rem;height:8rem;margin:0 auto .6rem;animation:saute 1s ease-in-out infinite alternate}
.astuce-memo.avec-coco{display:flex;gap:.6rem;align-items:center}
.astuce-memo.avec-coco p{margin:0}
.mission-cadeau img.coco{border-color:#fff}


/* Images-mémoire */
figure.memo{margin:.6rem 0;text-align:center}
figure.memo img{display:block;width:100%;max-width:17rem;margin:0 auto;border-radius:1rem;border:3px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.12)}
figure.memo figcaption{font-weight:800;margin-top:.35rem;color:var(--purple)}
figure.memo.petit{display:flex;align-items:center;gap:.6rem;text-align:left;margin:.4rem 0}
figure.memo.petit img{width:5.5rem;margin:0;flex:none;border-width:2px}
figure.memo.petit figcaption{margin:0}
.bande-memo{display:flex;gap:.7rem;overflow-x:auto;padding:.3rem 0 .6rem;margin:.4rem 0;scroll-snap-type:x mandatory}
.bande-memo figure.memo{flex:none;width:11rem;margin:0;scroll-snap-align:start}
.bande-memo figure.memo figcaption{font-size:.82rem;line-height:1.2}
.image-jeu{display:block;width:100%;max-width:19rem;margin:.4rem auto .7rem;border-radius:1.2rem;border:4px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.14)}
.legende-jeu{margin:.8rem 0 0;font-weight:700;border-radius:.9rem;padding:.6rem .8rem}
.legende-jeu.ok{background:var(--ok-bg)}.legende-jeu.ko{background:var(--ko-bg)}
.photo-bonjour.famille{aspect-ratio:1.25/1;object-position:50% 25%}
.photo-famille{display:block;width:min(17rem,85%);margin:0 auto;aspect-ratio:1.2/1;object-fit:cover;object-position:50% 25%;border-radius:1.2rem;border:4px solid var(--sun);box-shadow:0 5px 0 var(--sun-dark)}
.but-famille{margin:.3rem 0 0;text-align:center}
.but-famille img{display:block;width:100%;border-radius:1.1rem;border:3px solid var(--sun);aspect-ratio:1.5/1;object-fit:cover;object-position:50% 30%}
.but-famille figcaption{font-family:var(--display);font-weight:800;margin-top:.4rem;color:var(--purple)}


/* ===== Écran d’examen : sobre, comme la plateforme officielle ===== */
.exam-ecran{background:#fff;color:#16213A;border-radius:.6rem;border:1px solid #C9D1DD;padding:0 0 1rem;margin:-.2rem -.3rem 0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;animation:none!important}
.exam-entete{display:flex;justify-content:space-between;align-items:center;gap:.6rem;background:#1F2F5C;color:#fff;padding:.7rem .9rem;border-radius:.55rem .55rem 0 0}
.exam-entete b{display:block;font-size:1.05rem}.exam-entete small{opacity:.85}
.exam-quitter{color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:.4rem;padding:.3rem .6rem;font-size:.85rem}
.exam-infos{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;padding:.7rem .9rem .4rem}
.exam-infos div{background:#F2F5FA;border:1px solid #D9E0EC;border-radius:.4rem;padding:.4rem .6rem}
.exam-infos small{display:block;color:#56627A;font-size:.78rem}
.exam-infos b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.exam-jauge{height:6px;background:#E3E8F1;margin:.3rem .9rem .9rem;border-radius:3px;overflow:hidden}
.exam-jauge div{height:100%;background:#1F2F5C}
.exam-question{font-size:1.15rem;font-weight:700;line-height:1.4;margin:0;padding:0 .9rem}
.exam-ecouter{display:flex;align-items:center;gap:.5rem;margin:.8rem .9rem 0;border:1px solid #1F2F5C;color:#1F2F5C;border-radius:.4rem;padding:.6rem .8rem;font-weight:700}
.exam-ecouter svg{width:1.3rem;height:1.3rem}
.exam-ecouter:disabled{opacity:.5}
.exam-options{display:grid;gap:.55rem;padding:.9rem}
.exam-opt{display:flex;align-items:flex-start;gap:.7rem;text-align:left;width:100%;background:#fff;border:1px solid #B9C3D3;border-radius:.45rem;padding:.8rem .8rem;font-size:1.02rem;line-height:1.35;color:#16213A}
.exam-opt .radio{flex:none;width:1.2rem;height:1.2rem;border-radius:50%;border:2px solid #7A869C;margin-top:.1rem}
.exam-opt.choisie{background:#E7EEFC;border-color:#2D55C4}
.exam-opt.choisie .radio{border-color:#2D55C4;background:radial-gradient(circle,#2D55C4 0 45%,#fff 50%)}
.exam-boutons{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;padding:0 .9rem;margin-right:3.6rem}
.exam-passer,.exam-valider{border-radius:.45rem;padding:.8rem .5rem;font-weight:700;font-size:.98rem}
.exam-passer{background:#fff;border:1px solid #7A869C;color:#16213A}
.exam-passer:disabled{opacity:.45}
.exam-valider{background:#1F2F5C;color:#fff;border:1px solid #1F2F5C}


/* Accueil : guide + libre choix */
.titre-section{font-family:var(--display);font-size:1.15rem;margin:1.1rem 0 .4rem;color:var(--muted)}
.resume-jour{background:var(--surface);border:2px solid var(--line);border-radius:1.1rem;padding:.65rem .9rem;margin-top:.2rem}
.resume-jour p{margin:.35rem 0 0;font-weight:700;color:var(--purple);font-size:.93rem}
.resume-jour .jauge div{background:linear-gradient(90deg,#8A4FE0,#E056A0)}
.resume-jour p:only-child{margin:0;color:var(--ink)}
.bloc-libre{border-radius:1.3rem;padding:.8rem;margin-top:.7rem;background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 5px 0 rgba(0,0,0,.14)}
.bloc-libre h3{font-family:var(--display);color:#fff;margin:0 0 .6rem .2rem;font-size:1.25rem}
.tuiles{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.tuile{display:flex;align-items:center;gap:.5rem;text-align:left;background:rgba(255,255,255,.95);border-radius:.9rem;padding:.55rem .6rem;color:#16213A;box-shadow:0 3px 0 rgba(0,0,0,.12);line-height:1.15}
.tuile:active{transform:translateY(2px);box-shadow:none}
.tuile.large{grid-column:1/-1;background:#FFE066}
.tuile b{display:block;font-size:.98rem}
.tuile small{display:block;font-weight:700;color:#56627A;font-size:.76rem;margin-top:.1rem}
.tuile-ico{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;background:linear-gradient(150deg,var(--c1),var(--c2));display:grid;place-items:center}
.tuile-ico svg{width:1.5rem;height:1.5rem}
/* Choix du centre et variante CCI */
.choix-centre{display:grid;gap:.5rem;margin:.5rem 0}
.choix-centre button{text-align:left;border:2px solid var(--line);border-radius:.8rem;padding:.6rem .7rem;background:var(--bg)}
.choix-centre button small{display:block;color:var(--muted);font-weight:700}
.choix-centre button.on{border-color:var(--mint);background:var(--ok-bg);box-shadow:0 3px 0 var(--mint)}
.exam-grille{display:grid;grid-template-columns:repeat(8,1fr);gap:.3rem;padding:.9rem .9rem 0}
.exam-grille button{border:1px solid #B9C3D3;border-radius:.3rem;padding:.35rem 0;font-size:.8rem;background:#fff;color:#16213A}
.exam-grille button.rep{background:#DDE6F7;border-color:#2D55C4}
.exam-grille button.ici{outline:2px solid #1F2F5C}
.exam-terminer{display:block;margin:.9rem .9rem 0;width:calc(100% - 5.4rem);border:1px solid #1F2F5C;color:#1F2F5C;background:#fff;border-radius:.45rem;padding:.7rem;font-weight:700}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

{k:"a",x:"Votre colis est arrivé. Vous pouvez le récupérer au bureau de poste avec une pièce d’identité.",q:"Qu’est-ce qu’il faut apporter ?",o:["Une pièce d’identité","De l’argent","Une photo","Un stylo"],e:"Pièce d’identité = carte d’identité, passeport ou titre de séjour."},
{k:"a",x:"J’ai acheté des pommes, du lait et des œufs. Mais j’ai oublié le pain.",q:"Qu’est-ce qu’il a oublié ?",o:["Le pain","Le lait","Les œufs","Les pommes"],e:"« Mais j’ai oublié le pain. »"},
{k:"a",x:"Ma sœur habite à Lyon. Elle est infirmière et elle a deux enfants.",q:"Quel est le métier de sa sœur ?",o:["Infirmière","Professeure","Médecin","Vendeuse"],e:"Une infirmière travaille à l’hôpital ou en cabinet."},
{k:"a",x:"Pour vous inscrire à la salle de sport, il faut un certificat médical et une photo.",q:"Que faut-il pour s’inscrire ?",o:["Un certificat médical et une photo","Un passeport","Un relevé bancaire","Rien"],e:"Le certificat médical est donné par le médecin."},
{k:"a",x:"Attention, ce samedi, le magasin fermera exceptionnellement à dix-sept heures.",q:"À quelle heure ferme le magasin samedi ?",o:["17 h","7 h","19 h","16 h"],e:"Dix-sept heures = 5 heures de l’après-midi."},
{k:"a",x:"Nous partons en vacances en Bretagne au mois d’août, pendant deux semaines.",q:"Combien de temps durent les vacances ?",o:["Deux semaines","Deux jours","Un mois","Une semaine"],e:"Pendant deux semaines, en août."},
{k:"a",x:"Excusez-moi, je cherche la pharmacie. Oui, c’est à côté de la banque, en face de l’école.",q:"Où est la pharmacie ?",o:["À côté de la banque","Derrière l’école","Dans la gare","Loin de la banque"],e:"À côté de = tout près. En face de = de l’autre côté."},
{k:"a",x:"Le vol pour Casablanca est retardé. L’embarquement est prévu à vingt et une heures, porte B.",q:"À quelle heure est l’embarquement ?",o:["21 h","20 h","12 h","1 h"],e:"Vingt et une heures = 9 heures du soir."},

{k:"r",q:"SMS : « Je suis en retard, le bus n’est pas passé. J’arrive dans 15 min. Commence sans moi. » Que doit faire la personne qui lit ?",o:["Commencer sans attendre","Venir chercher son ami","Prendre le bus","Annuler le rendez-vous"],e:"« Commence sans moi » : on n’attend pas."},
{k:"r",q:"Affiche : « Piscine fermée pour travaux du 3 au 17 mars. » Quand peut-on nager de nouveau ?",o:["Après le 17 mars","Le 3 mars","Le 10 mars","En février seulement"],e:"Elle rouvre après le 17 mars."},
{k:"r",q:"Vitrine : « Soldes : -30 % sur toutes les chaussures. » Ça veut dire…",o:["Les chaussures coûtent moins cher","Les chaussures coûtent plus cher","Il reste 30 chaussures","Le magasin ferme"],e:"Les soldes = les prix baissent."},
{k:"r",q:"Courrier : « Merci d’envoyer une copie de votre passeport avant le 10 juin. » Que faut-il faire ?",o:["Envoyer une copie du passeport avant le 10 juin","Venir au bureau le 10 juin","Faire un nouveau passeport","Téléphoner le 10 juin"],e:"Une copie = une photocopie ou un scan."},
{k:"r",q:"Menu : « Plat du jour : poulet et riz, 12 €. Boisson non comprise. » La boisson est-elle dans le prix ?",o:["Non, on la paie en plus","Oui, elle est gratuite","Oui, une seule","Seulement l’eau gazeuse"],e:"Non comprise = pas incluse."},
{k:"r",q:"Panneau : « Interdit de stationner. » Ça veut dire…",o:["On ne peut pas garer sa voiture ici","On ne peut pas marcher ici","On ne peut pas parler ici","On peut se garer 5 minutes"],e:"Stationner = garer sa voiture."},
{k:"r",q:"Message de l’école : « La sortie au musée est annulée à cause de la pluie. » Que se passe-t-il ?",o:["Les enfants ne vont pas au musée","Ils vont au musée plus tôt","Le musée ferme pour toujours","Il faut payer la sortie"],e:"Annulée = elle n’a pas lieu."},
{k:"r",q:"Annonce : « Cherche baby-sitter le mercredi après-midi, 3 h par semaine. » Quand faut-il travailler ?",o:["Le mercredi après-midi","Tous les jours","Le week-end","Le mercredi matin"],e:"3 heures, le mercredi après-midi."},
{k:"r",q:"Mot sur la porte d’un magasin : « Je reviens dans 10 minutes. » Ça veut dire…",o:["La vendeuse revient bientôt","Le magasin ferme pour toujours","Il faut attendre une heure","On peut entrer"],e:"Dans 10 minutes = bientôt."},
{k:"r",q:"Ordonnance : « 1 comprimé matin et soir pendant 5 jours. » Combien de comprimés en tout ?",o:["10","5","2","15"],e:"2 par jour × 5 jours = 10."},
{k:"r",q:"Invitation : « Samedi, anniversaire de Léa à la piscine, 15 h. Apporte ton maillot de bain ! » Qu’est-ce qu’il faut apporter ?",o:["Un maillot de bain","Un gâteau","Un manteau","Des chaussures de sport"],e:"La fête est à la piscine."},
{k:"r",q:"Panneau : « Sortie de secours. » C’est…",o:["Une porte pour sortir en cas de danger","L’entrée principale","Les toilettes","Un ascenseur"],e:"On l’utilise s’il y a le feu, par exemple."},
{k:"r",q:"Mail : « Bonjour, la réunion de demain est déplacée à vendredi, même heure. » Que se passe-t-il ?",o:["La réunion a lieu vendredi","La réunion est annulée","L’heure change","La réunion est toujours demain"],e:"Déplacée = changée de jour."},
{k:"r",q:"Étiquette : « À conserver au réfrigérateur après ouverture. » Que faut-il faire ?",o:["Mettre au frigo une fois ouvert","Ne jamais mettre au frigo","Tout manger tout de suite","Mettre au congélateur"],e:"Réfrigérateur = frigo."},
{k:"r",q:"Affiche de la mairie : « Inscriptions à l’école maternelle jusqu’au 30 avril. Apportez le livret de famille et un justificatif de domicile. » Qu’est-ce qu’il faut apporter ?",o:["Le livret de famille et un justificatif de domicile","Une photo de l’enfant","Un bulletin de salaire","Rien"],e:"Justificatif de domicile = une facture avec ton adresse."},
{k:"r",q:"SMS : « Tu peux acheter du lait en rentrant stp ? » Que demande la personne ?",o:["D’acheter du lait","De boire du lait","De téléphoner","De rentrer tard"],e:"Stp = s’il te plaît."},
{k:"r",q:"Horaires : « Lundi au vendredi : 8 h – 18 h. Samedi : 9 h – 12 h. » Peut-on venir le samedi à 15 h ?",o:["Non, c’est fermé","Oui","Oui, jusqu’à 18 h","Seulement avec un rendez-vous"],e:"Le samedi, c’est seulement le matin."},
{k:"r",q:"Annonce : « À louer : studio 25 m², 2e étage sans ascenseur, 550 € charges comprises. » Quelle phrase est vraie ?",o:["Il n’y a pas d’ascenseur","Il est au rez-de-chaussée","Les charges sont en plus","Il fait 55 m²"],e:"Sans ascenseur = il faut prendre l’escalier."},
{k:"r",q:"Recette : « Faire cuire les pâtes 10 minutes dans l’eau bouillante. » Combien de temps faut-il cuire ?",o:["10 minutes","1 minute","1 heure","30 minutes"],e:"Bouillante = très chaude, qui fait des bulles."},
{k:"r",q:"Message de l’école : « Votre enfant était absent lundi. Merci de justifier cette absence. » Que faut-il faire ?",o:["Expliquer pourquoi l’enfant était absent","Payer une amende","Venir lundi","Acheter un cahier"],e:"Justifier = donner la raison."},

{k:"o",s:"Je m’appelle Samira et je suis marocaine.",e:"Pour se présenter : je m’appelle…, je suis…"},
{k:"o",s:"J’habite en France avec mon mari.",e:"Habiter en France, au Maroc, à Paris."},
{k:"o",s:"Nous allons au marché le samedi.",e:"Le samedi = tous les samedis."},
{k:"o",s:"Je voudrais un rendez-vous chez le médecin.",e:"« Je voudrais » est plus poli que « je veux »."},
{k:"o",s:"Il fait très froid aujourd’hui.",e:"Pour la météo, on dit « il fait »."},
{k:"o",s:"Mon fils va à l’école à pied.",e:"À pied, en bus, en voiture."},
{k:"o",s:"Le train part à huit heures.",e:"Partir à + heure."},
{k:"o",s:"Pouvez-vous parler plus lentement ?",e:"Une phrase très utile !"},
{k:"o",s:"Ma sœur est plus grande que moi.",e:"Plus … que : pour comparer."},
{k:"o",s:"Hier, nous avons mangé au restaurant.",e:"Hier = passé composé."},
{k:"o",s:"Je n’aime pas le café.",e:"La négation : ne … pas."},
{k:"o",s:"Où est la gare, s’il vous plaît ?",e:"Pour demander son chemin."},
{k:"o",s:"Combien coûte ce pantalon ?",e:"Pour demander un prix."},
{k:"o",s:"Demain, je vais chez ma mère.",e:"Chez + une personne."},
{k:"o",s:"Le magasin est fermé le dimanche.",e:"Fermé ≠ ouvert."},
{k:"o",s:"Je suis arrivée hier soir.",e:"Arriver se conjugue avec « être »."},
{k:"o",s:"Mon mari travaille dans une banque.",e:"Travailler dans + un lieu."},
{k:"o",s:"Nous prenons le bus pour aller au travail.",e:"Pour + verbe = le but."},
{k:"o",s:"Est-ce que tu viens avec nous ?",e:"« Est-ce que » pour poser une question."},
{k:"o",s:"Elle a mal à la tête depuis ce matin.",e:"Avoir mal à la tête, au dos, au ventre."},
{k:"o",s:"Je dois aller à la préfecture demain.",e:"Devoir + verbe = une obligation."},
{k:"o",s:"Il y a une pharmacie près d’ici.",e:"Il y a = ça existe."},
{k:"o",s:"Les enfants jouent dans le parc.",e:"Ils jouent : le verbe finit par -ent."},
{k:"o",s:"Je voudrais payer par carte.",e:"Par carte, en espèces."},
{k:"o",s:"Quelle heure est-il, s’il vous plaît ?",e:"Pour demander l’heure."},

{k:"g",q:"Hier, je … au marché.",o:["suis allée","vais","irai","aller"],e:"Hier = passé. Avec « aller », on dit « je suis allée » pour une femme."},
{k:"g",q:"Demain, nous … chez le médecin.",o:["irons","sommes allés","allions","aller"],e:"Demain = futur : nous irons."},
{k:"g",q:"Quand j’étais petite, j’… à Casablanca.",o:["habitais","habiterai","habite","ai habiter"],e:"Pour une habitude passée : l’imparfait."},
{k:"g",q:"Je voudrais … pain, s’il vous plaît.",o:["du","de la","des","le"],e:"Du pain, de la confiture, des œufs."},
{k:"g",q:"Elle … deux enfants.",o:["a","est","as","ont"],e:"Avoir : j’ai, tu as, elle a."},
{k:"g",q:"Les enfants … à l’école à pied.",o:["vont","va","allons","allez"],e:"Aller : ils vont."},
{k:"g",q:"Je ne mange … de porc.",o:["pas","rien","non","plus pas"],e:"Ne … pas."},
{k:"g",q:"Quelle phrase est la plus polie ?",o:["Pourriez-vous m’aider, s’il vous plaît ?","Aide-moi !","Tu m’aides ?","Je veux de l’aide."],e:"« Pourriez-vous » + « s’il vous plaît » = très poli."},
{k:"g",q:"C’est … voiture de mon mari.",o:["la","le","les","un"],e:"La voiture : féminin."},
{k:"g",q:"Tu viens … moi au supermarché ?",o:["avec","dans","sur","chez"],e:"Venir avec quelqu’un."},
{k:"g",q:"Nous … français et arabe.",o:["parlons","parlez","parlent","parle"],e:"Nous parlons, vous parlez, ils parlent."},
{k:"g",q:"Vous … d’où ?",o:["venez","viens","venons","vient"],e:"Vous venez. Réponse : je viens du Maroc."},
{k:"g",q:"Tu … faim ?",o:["as","es","a","est"],e:"Avoir faim, avoir soif, avoir froid."},
{k:"g",q:"Il … médecin.",o:["est","a","et","ai"],e:"Pour un métier : il est médecin."},
{k:"g",q:"C’est … ami de Karim.",o:["un","une","des","la"],e:"Un ami, une amie."},
{k:"g",q:"Ils … à Marseille l’année dernière.",o:["sont allés","vont","iront","allons"],e:"L’année dernière = passé."},
{k:"g",q:"Elle se … à 7 heures.",o:["lève","lèves","lever","levons"],e:"Se lever : je me lève, elle se lève."},
{k:"g",q:"Je téléphone … ma mère tous les jours.",o:["à","de","chez","sur"],e:"Téléphoner à quelqu’un."},
{k:"g",q:"Il y a … pommes dans le panier.",o:["des","du","de la","un"],e:"Des + pluriel."},
{k:"g",q:"Mon frère est … grand que moi.",o:["plus","très","beaucoup","trop"],e:"Plus … que."},
{k:"g",q:"Nous habitons … Paris.",o:["à","en","au","aux"],e:"À + ville."},
{k:"g",q:"Ma famille habite … Maroc.",o:["au","à","en","aux"],e:"Au Maroc, en France, aux États-Unis."},
{k:"g",q:"Je vais … Espagne cet été.",o:["en","au","à","aux"],e:"En + pays féminin : en France, en Espagne."},
{k:"g",q:"… est-ce que tu habites ? À Lyon.",o:["Où","Quand","Combien","Pourquoi"],e:"Où = le lieu."},
{k:"g",q:"… coûte ce sac ? 20 euros.",o:["Combien","Où","Qui","Comment"],e:"Combien = le prix ou la quantité."},

{k:"v",q:"Où achète-t-on du pain ?",o:["À la boulangerie","À la pharmacie","À la poste","À la banque"],e:"Pain, croissants, baguette."},
{k:"v",q:"Le contraire de « ouvert », c’est…",o:["fermé","grand","loin","cher"],e:"Ouvert ≠ fermé."},
{k:"v",q:"Quel jour vient après mercredi ?",o:["Jeudi","Mardi","Vendredi","Lundi"],e:"Lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche."},
{k:"v",q:"Quel mois vient après juillet ?",o:["Août","Juin","Septembre","Mars"],e:"Juin, juillet, août, septembre."},
{k:"v",q:"Le loyer, c’est…",o:["L’argent payé chaque mois pour un logement","Le prix d’un billet de train","Un papier d’identité","Un salaire"],e:"Le locataire paie le loyer au propriétaire."},
{k:"v",q:"J’ai mal à la tête. Je vais à la…",o:["pharmacie","boulangerie","librairie","boucherie"],e:"On y achète des médicaments."},
{k:"v",q:"Un « justificatif de domicile », c’est par exemple…",o:["Une facture d’électricité","Un ticket de bus","Une photo de la maison","Un passeport"],e:"Il prouve ton adresse."},
{k:"v",q:"Pour envoyer un colis, je vais…",o:["À la poste","À la mairie","Au cinéma","À la piscine"],e:"La poste envoie lettres et colis."},
{k:"v",q:"Quelle phrase sert à se présenter ?",o:["Je m’appelle Amina, j’ai 30 ans.","Il fait beau aujourd’hui.","Où est la gare ?","Combien ça coûte ?"],e:"Nom, âge, pays, métier."},
{k:"v",q:"La personne qui soigne les dents, c’est…",o:["Le dentiste","Le boulanger","Le facteur","Le plombier"],e:"On prend rendez-vous chez le dentiste."},
{k:"v",q:"Pour laver le linge, j’utilise…",o:["La machine à laver","Le four","Le frigo","L’aspirateur"],e:"Le four sert à cuire."},
{k:"v",q:"Le contraire de « chaud », c’est…",o:["froid","grand","lent","sale"],e:"Chaud ≠ froid."},
{k:"v",q:"Le fils de mon oncle, c’est mon…",o:["cousin","neveu","frère","grand-père"],e:"La fille de mon oncle, c’est ma cousine."},
{k:"v",q:"Quelle saison vient après l’hiver ?",o:["Le printemps","L’été","L’automne","Noël"],e:"Hiver, printemps, été, automne."},
{k:"v",q:"On range ses vêtements dans…",o:["Une armoire","Un frigo","Un four","Une baignoire"],e:"Armoire = un grand meuble avec des portes."},
{k:"v",q:"Un CV, c’est…",o:["Un document qui présente ton parcours pour trouver un travail","Une carte bancaire","Un médicament","Un ticket de métro"],e:"On l’envoie avec une lettre de motivation."},
{k:"v",q:"« Je suis enrhumée », ça veut dire…",o:["J’ai un rhume","J’ai faim","Je suis en retard","Je suis contente"],e:"Le nez qui coule, on éternue."},
{k:"v",q:"Le facteur apporte…",o:["Le courrier","Le pain","Les médicaments","Les enfants à l’école"],e:"Lettres et colis."},
{k:"v",q:"Pour payer au supermarché, je vais à la…",o:["caisse","cuisine","chambre","cave"],e:"La caissière ou le caissier."},
{k:"v",q:"Qui donne une ordonnance ?",o:["Le médecin","Le boulanger","Le maire","Le professeur"],e:"Avec l’ordonnance, on va à la pharmacie."},
{k:"v",q:"« À tout à l’heure » veut dire…",o:["On se revoit plus tard aujourd’hui","Au revoir pour toujours","Bonjour","Merci beaucoup"],e:"À demain = on se revoit demain."},
{k:"v",q:"Un billet « aller-retour », c’est…",o:["Un billet pour partir et revenir","Un billet pour partir seulement","Une carte de crédit","Un repas"],e:"Un « aller simple », c’est seulement pour partir."},
{k:"v",q:"Où est la salle d’attente ?",o:["Chez le médecin","À la boulangerie","Dans le jardin","À la piscine"],e:"On attend son tour avant le rendez-vous."},
{k:"v",q:"Pour un entretien d’embauche, tu dis :",o:["Bonjour, je viens pour le poste de vendeuse.","Salut, ça va ?","Coucou !","À plus !"],e:"Au travail, on reste poli : bonjour, vous."},
{k:"v",q:"« Je suis désolée », ça sert à…",o:["S’excuser","Dire merci","Dire bonjour","Demander l’heure"],e:"Pardon, excusez-moi, je suis désolée."}
];

   Le jour de l’examen : 28 questions de connaissance (liste officielle) + 12 mises en situation
   (6 « valeurs de la République » et 6 « droits et devoirs »), d’après l’arrêté du 10 octobre 2025. */
CIV_RAW.push(
["val","Lequel de ces personnages est l’allégorie de la République française ?",["Marianne","Jeanne d’Arc","Napoléon","Charlemagne"],"Une allégorie, c’est une image qui représente une idée. Marianne représente la République."],
["val","Quels sont des symboles officiels de la République française ?",["Le drapeau tricolore, La Marseillaise et la devise","La tour Eiffel et le croissant","Le lion et l’aigle","Le Louvre et la Seine"],"Ils sont écrits dans l’article 2 de la Constitution."],
["dro","Comment s’appelle le texte qui énonce les droits et devoirs des personnes résidant en France ?",["La Déclaration des droits de l’homme et du citoyen","Le Code de la route","Le règlement de la mairie","Le contrat de travail"],"Elle date de 1789 et elle est toujours en vigueur."],
["dro","Concernant les droits individuels, quelle phrase est correcte ?",["Chacun est libre de ses choix, dans le respect de la loi","Le mari décide pour sa femme","Les parents choisissent le mari de leur fille","Seuls les Français ont des droits"],"Liberté de circuler, de se marier, de divorcer, de penser : chacun décide pour lui-même."],

/* --- Mises en situation : valeurs de la République --- */
["val","Au travail, ton collègue refuse d’obéir à sa cheffe parce que c’est une femme. Est-ce acceptable ?",["Non, l’égalité femmes-hommes s’applique au travail","Oui, s’il a une raison religieuse","Oui, si le patron est d’accord","Oui, s’il est plus âgé qu’elle"],"Une femme peut diriger une équipe comme un homme.",1],
["val","À la mairie, un homme exige d’être reçu par un agent homme et pas par une femme. Que fait la mairie ?",["Elle refuse : on ne choisit pas l’agent selon son sexe","Elle accepte toujours","Elle appelle un imam ou un prêtre","Elle lui demande de revenir le dimanche"],"Tous les usagers sont égaux devant le service public, et ils doivent respecter ses règles.",1],
["val","Une maman ne veut pas que sa fille aille aux cours de natation de l’école pour une raison religieuse. A-t-elle le droit ?",["Non, on ne peut pas refuser un cours pour une raison religieuse","Oui, toujours","Oui, si elle écrit un mot","Oui, si la fille a plus de 8 ans"],"Les cours sont obligatoires pour tous les élèves.",1],
["val","Un journal publie un dessin qui se moque d’une religion. Est-ce autorisé en France ?",["Oui, critiquer une religion est permis ; appeler à la haine contre des personnes est interdit","Non, c’est toujours interdit","Oui, mais seulement pour une religion","Non, la police ferme le journal"],"En France, le blasphème n’est pas un délit. Mais on ne peut pas attaquer les croyants.",1],
["val","Ton amie veut changer de religion. Sa famille la menace. Que peut-elle faire ?",["C’est sa liberté : elle peut porter plainte pour les menaces","Elle doit obéir à sa famille","Elle doit demander l’accord de la mairie","Elle n’a pas le droit de changer"],"La liberté de conscience permet de croire, de ne plus croire ou de changer de religion.",1],
["val","Dans une entreprise privée, le port d’un signe religieux peut-il être limité ?",["Oui, pour des raisons d’hygiène, de sécurité ou de bon fonctionnement","Non, jamais","Oui, si le patron n’aime pas cette religion","Oui, seulement pour les femmes"],"La limite doit être justifiée et prévue, par exemple dans le règlement intérieur.",1],
["val","Une enseignante d’école publique peut-elle porter un signe religieux en classe ?",["Non, les agents publics doivent rester neutres","Oui, si elle est discrète","Oui, si les parents sont d’accord","Oui, le vendredi"],"Les élèves, eux, ne peuvent pas porter de signe religieux très visible.",1],
["val","À l’hôpital public, une patiente porte un foulard. A-t-elle le droit ?",["Oui, les usagers peuvent montrer leur religion, en respectant les règles du service","Non, c’est interdit à l’hôpital","Seulement dans sa chambre","Seulement si le médecin est d’accord"],"Les usagers ont des droits, les agents doivent être neutres.",1],
["val","Un propriétaire refuse de louer son appartement à une famille à cause de son origine. C’est…",["Une discrimination interdite et punie","Son droit","Normal s’il préfère","Autorisé s’il le dit poliment"],"On peut porter plainte ou contacter le Défenseur des droits.",1],
["val","Un restaurant refuse de servir un couple de deux hommes. Est-ce permis ?",["Non, c’est une discrimination interdite","Oui, le patron choisit ses clients","Oui, le soir seulement","Oui, si le restaurant est religieux"],"Refuser un service à cause de l’orientation sexuelle est puni par la loi.",1],
["val","Ton voisin insulte un autre voisin à cause de sa couleur de peau. Que dit la loi ?",["C’est un délit : la victime peut porter plainte","Ce n’est pas grave","C’est la liberté d’expression","Ce n’est interdit que sur internet"],"Le racisme est puni en France.",1],
["val","Tu vois des tags antisémites sur le mur de ton immeuble. Que fais-tu ?",["Je préviens la police ou la mairie","Je ne fais rien","J’écris d’autres tags","J’attends que ça parte avec la pluie"],"L’antisémitisme est un délit. Le signaler aide à le combattre.",1],
["val","Deux femmes veulent se marier à la mairie. Est-ce possible ?",["Oui, le mariage est ouvert aux couples de même sexe depuis 2013","Non, c’est interdit","Seulement à l’étranger","Seulement avec l’accord de leurs parents"],"C’est la loi du « mariage pour tous ».",1],
