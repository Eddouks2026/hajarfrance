["val","Ta voisine veut créer une association pour aider les enfants du quartier. Est-ce possible ?",["Oui, c’est un droit : il suffit de la déclarer","Non, il faut être français","Non, c’est réservé aux hommes","Oui, mais seulement à Paris"],"La liberté d’association existe depuis la loi de 1901.",1],
["val","Ton collègue veut rejoindre un syndicat. Son patron le menace de le licencier. C’est…",["Interdit : le droit syndical est protégé","Normal","Autorisé dans les petites entreprises","Autorisé s’il prévient avant"],"Chaque salarié peut adhérer au syndicat de son choix.",1],
["val","Pendant une canicule, ta voisine âgée vit seule. Que peux-tu faire ?",["Prendre de ses nouvelles et l’aider si besoin","Rien, ce n’est pas ton problème","Appeler la police tout de suite","Attendre que sa famille vienne"],"C’est la fraternité : l’entraide entre voisins.",1],
["val","Une femme est payée moins qu’un homme pour le même travail. C’est…",["Interdit : à travail égal, salaire égal","Normal","Autorisé si elle a des enfants","Autorisé la première année"],"L’égalité salariale entre les femmes et les hommes est obligatoire.",1],
["val","Sur les réseaux sociaux, quelqu’un appelle à la haine contre les musulmans. Que fais-tu ?",["Je le signale : appeler à la haine est interdit","Je partage le message","Je réponds par des insultes","Rien, internet n’a pas de règles"],"On peut signaler les contenus illégaux en ligne sur la plateforme Pharos.",1],
["val","Quelqu’un dit : « Les femmes ne doivent pas voter. » Que dit la République ?",["C’est faux : les femmes votent depuis 1944, comme les hommes","C’est vrai","C’est vrai à la campagne","C’est vrai pour les femmes étrangères"],"Femmes et hommes ont exactement les mêmes droits politiques.",1],
["val","Un homme distribue des tracts religieux aux enfants devant l’école et insiste. Est-ce acceptable ?",["Non, on ne doit pas faire pression sur les élèves","Oui, c’est la liberté de religion","Oui, si les tracts sont gratuits","Oui, le mercredi"],"L’école protège la liberté de choix de chaque enfant.",1],

["dro","Dans la rue, tu vois une personne se faire agresser. Que fais-tu ?",["J’appelle le 17 sans me mettre en danger","Je filme et je pars","Je ne fais rien","Je frappe l’agresseur"],"Ne pas aider une personne en danger est puni. Appeler les secours, c’est déjà aider.",1],

["dro","Tu es convoquée comme témoin au tribunal. Que dois-tu faire ?",["Y aller : c’est une obligation","Rien, c’est facultatif","Envoyer un ami à ta place","Répondre par SMS"],"Aider la justice est un devoir.",1],
["dro","Quelqu’un filme une personne sans son accord et publie la vidéo pour se moquer d’elle. C’est…",["Interdit : c’est une atteinte à la vie privée","Permis sur internet","Permis si c’est drôle","Permis si la vidéo est courte"],"La victime peut porter plainte.",1],

["dro","Un ami veut conduire après avoir bu beaucoup d’alcool. Que fais-tu ?",["Je l’en empêche : c’est interdit et dangereux","Je le laisse faire","Je monte avec lui","Je lui donne un café et il part"],"L’alcool au volant est une cause majeure d’accidents mortels.",1],
["dro","On t’a volé ton téléphone. Que fais-tu ?",["Je porte plainte au commissariat ou à la gendarmerie","Rien","Je cherche le voleur seule","J’attends qu’on me le rende"],"On peut aussi faire une pré-plainte en ligne.",1],
["dro","Tu reçois des menaces par message sur ton téléphone. Que fais-tu ?",["Je garde les messages et je porte plainte","J’efface tout","Je menace aussi","Je change de pays"],"Les messages sont des preuves.",1],
["dro","Ton propriétaire entre chez toi quand tu n’es pas là, sans te prévenir. A-t-il le droit ?",["Non : le logement loué est ton domicile","Oui, c’est son appartement","Oui, une fois par mois","Oui, s’il a les clés"],"Le locataire est chez lui. Le propriétaire doit demander son accord.",1],

["dro","Un ami te propose de cacher une partie de tes revenus aux impôts. C’est…",["De la fraude, interdite et punie","Une bonne idée","Normal","Autorisé pour les petits revenus"],"Déclarer ses revenus chaque année est une obligation.",1],
["dro","Tu trouves une personne allongée par terre, qui ne répond pas. Que fais-tu ?",["J’appelle le 15, le 18 ou le 112","Je continue mon chemin","Je la secoue très fort","Je lui donne à boire"],"Les secours te diront quoi faire en attendant.",1],
["dro","Une collègue subit des remarques sexuelles de son chef. Que peut-elle faire ?",["En parler à la direction ou à l’inspection du travail, et porter plainte","Se taire pour garder son travail","Démissionner sans rien dire","En rire"],"Le harcèlement sexuel est un délit.",1],
["dro","Le mari de ta voisine lui interdit de travailler. A-t-il le droit ?",["Non, elle est libre de travailler","Oui, c’est son mari","Oui, s’ils ont des enfants","Oui, s’il gagne assez"],"Chaque époux peut travailler sans l’accord de l’autre.",1],

/* ===== Expression écrite (comme au TCF IRN : 3 tâches, 30 minutes) ===== */
const ECRIRE = [
 {t:1,min:30,max:60,c:"Vous répondez à Jenny. Elle vous demande : « Ton amie Emma vient avec nous samedi ? Elle est comment ? » Décrivez votre amie (âge, métier, caractère).",idees:["Son âge","Son métier","Son caractère","Si elle vient samedi"],ex:"Salut Jenny ! Oui, Emma vient avec nous samedi. Elle a 32 ans et elle est infirmière à l’hôpital. Elle est très gentille et drôle. Elle aime beaucoup danser et cuisiner. Tu vas l’adorer ! À samedi, bisous."},
 {t:1,min:30,max:60,c:"Vous écrivez à votre voisin. Vous l’invitez à prendre un thé chez vous (jour, heure, adresse).",idees:["Le jour","L’heure","Ton adresse ou ton étage","Une formule gentille"],ex:"Bonjour Monsieur Durand, je vous invite à prendre un thé chez moi samedi à 16 h. J’habite au deuxième étage, porte gauche. Je vais préparer des gâteaux marocains. J’espère que vous pourrez venir. Bonne journée, Samira."},
 {t:1,min:30,max:60,c:"Vous ne pouvez pas aller au cours de français demain. Vous écrivez un message à votre professeure pour expliquer pourquoi.",idees:["Dire que tu ne viens pas","Dire pourquoi","T’excuser","Demander les devoirs"],ex:"Bonjour Madame, je ne peux pas venir au cours de demain parce que ma fille est malade. Je suis désolée. Est-ce que vous pouvez m’envoyer les exercices, s’il vous plaît ? Merci beaucoup et à jeudi prochain."},
 {t:1,min:30,max:60,c:"Une amie veut visiter votre ville. Vous lui écrivez pour lui conseiller un lieu à visiter.",idees:["Le nom du lieu","Pourquoi il est bien","Comment y aller","Une formule pour finir"],ex:"Coucou Léa ! Si tu viens dans ma ville, il faut visiter le vieux port. C’est très joli, surtout le soir. Il y a des restaurants et des bateaux. Tu peux y aller en tram, ligne 2. Bisous !"},
 {t:2,min:40,max:90,c:"Vous répondez à Élise. Vous lui racontez le mariage de votre cousin.",idees:["Où et quand","Qui était là","Ce que vous avez fait (repas, danse)","Ce que vous avez aimé"],ex:"Salut Élise ! Samedi dernier, je suis allée au mariage de mon cousin à Casablanca. Il y avait beaucoup de monde, toute la famille était là. La mariée portait un caftan magnifique. Nous avons mangé un délicieux repas et nous avons dansé jusqu’à trois heures du matin. J’ai adoré la musique ! J’étais fatiguée mais très contente. Et toi, ça va ? Bisous."},
 {t:2,min:40,max:90,c:"Vous écrivez à une amie pour raconter votre premier jour dans un nouveau travail.",idees:["Le lieu de travail","Les collègues","Ce que tu as fait","Ce que tu as ressenti"],ex:"Coucou Sara ! Hier, c’était mon premier jour dans la boulangerie. Je suis arrivée à 6 heures. Mes collègues sont très gentils, ils m’ont tout expliqué. J’ai servi les clients et j’ai rangé les gâteaux. J’étais un peu stressée au début, mais à la fin j’étais contente. Le travail me plaît beaucoup ! Et toi, comment ça va ? Bisous."},
 {t:2,min:40,max:90,c:"Vous racontez à un ami votre dernier week-end.",idees:["Samedi : ce que tu as fait","Dimanche : ce que tu as fait","Avec qui","Ton avis"],ex:"Salut Karim ! Ce week-end, je me suis bien reposée. Samedi matin, je suis allée au marché avec mon mari. Nous avons acheté des fruits et du poisson. L’après-midi, nous avons regardé un film à la maison. Dimanche, nous avons fait une promenade au parc avec des amis et nous avons pique-niqué. C’était un très beau week-end ! Et toi ?"},
 {t:2,min:40,max:90,c:"Vous écrivez à votre famille au Maroc pour raconter une journée typique en France.",idees:["Le matin","L’après-midi","Le soir","Ce qui est différent du Maroc"],ex:"Bonjour à tous ! Voici ma journée en France. Le matin, je me lève à 7 heures et je prends un café. Ensuite, je vais à mon cours de français. À midi, je déjeune à la maison. L’après-midi, je fais les courses ou je me promène. Le soir, nous dînons à 20 heures. Ici, on mange plus tôt qu’au Maroc ! Vous me manquez. Je vous embrasse."},
 {t:3,min:40,max:90,c:"Sur un forum, on demande : « Vous préférez habiter en ville ou à la campagne ? Pourquoi ? » Donnez votre opinion.",idees:["Ton choix","Une première raison","Une deuxième raison","Une phrase pour conclure"],ex:"Moi, je préfère habiter en ville. D’abord, il y a beaucoup de magasins, de transports et de services comme les hôpitaux. Ensuite, on peut sortir le soir, aller au cinéma ou au restaurant. La campagne est calme et jolie, mais c’est loin de tout et il faut une voiture. Pour moi, la ville est plus pratique pour la vie de tous les jours."},
 {t:3,min:40,max:90,c:"Sur un site, on demande : « Faut-il interdire les téléphones portables à l’école ? » Donnez votre avis.",idees:["Ton avis : oui ou non","Une raison","Un exemple","Une conclusion"],ex:"À mon avis, il faut interdire les téléphones à l’école. Les élèves doivent écouter le professeur et pas regarder leur écran. Avec un téléphone, on peut tricher ou se moquer des autres sur internet. Pour moi, l’école est un lieu pour apprendre et parler avec ses amis. Les élèves peuvent utiliser leur téléphone après les cours."},
 {t:3,min:40,max:90,c:"Sur un forum, on demande : « Faire du sport, c’est important ? » Donnez votre opinion.",idees:["Ton avis","Pour la santé","Pour le moral","Ce que tu fais, toi"],ex:"Oui, je pense que faire du sport est très important. C’est bon pour la santé : on dort mieux et on a plus d’énergie. Le sport aide aussi à être de bonne humeur et à rencontrer des gens. Moi, je marche trente minutes tous les jours et je fais de la gym le samedi. Je conseille à tout le monde de bouger un peu chaque jour."},
 {t:3,min:40,max:90,c:"Sur un site, on demande : « Apprendre une langue étrangère, c’est utile ? » Donnez votre avis.",idees:["Ton avis","Pour le travail","Pour les rencontres","Ton exemple personnel"],ex:"Pour moi, apprendre une langue étrangère est très utile. Pour le travail, c’est plus facile de trouver un emploi. On peut aussi parler avec des personnes d’autres pays et découvrir leur culture. Moi, j’apprends le français parce que j’habite en France. Maintenant, je peux parler avec mes voisins et faire mes démarches seule. C’est une vraie liberté !"}

V("val","Vous travaillez dans une mairie. Une collègue, agente d’accueil, porte un foulard pendant son service. Que dit la règle ?",["Les agents publics sont soumis à la neutralité : pas de signe religieux en service","Elle peut le porter si les usagers ne se plaignent pas","Elle peut le porter si le maire est d’accord","La règle ne concerne que les enseignants"],"La neutralité s’applique à tous les agents du service public.");
V("val","Vous êtes aux urgences d’un hôpital public. Vous préférez être soignée par une femme, mais seul un médecin homme est disponible. Que se passe-t-il ?",["Vous êtes soignée par le médecin disponible : on ne peut pas récuser un soignant en urgence","L’hôpital doit trouver une femme médecin avant tout soin","Votre mari décide à votre place","Vous devez attendre le lendemain"],"Les usagers ne peuvent pas refuser un agent en raison de son sexe.");
V("val","Votre fille est élève dans un collège public. Elle veut porter un signe religieux visible en classe. Est-ce possible ?",["Non, les signes religieux ostensibles sont interdits aux élèves des établissements publics","Oui, avec une autorisation écrite des parents","Oui, sauf pendant les cours de sport","Oui, si le chef d’établissement est d’accord"],"C’est la loi de 2004.");
V("val","Votre voisin vous dit que les femmes ne devraient pas travailler. Que dit la loi française ?",["Les femmes et les hommes ont les mêmes droits, y compris celui de travailler","Une femme mariée doit avoir l’accord de son mari","Certains métiers sont interdits aux femmes","La loi ne dit rien sur ce sujet"],"L’égalité entre les femmes et les hommes est un principe constitutionnel.");
V("val","Dans votre entreprise, une collègue gagne moins qu’un collègue homme pour le même poste et la même expérience. Que dit la loi ?",["À travail égal, le salaire doit être égal","L’employeur fixe librement des salaires différents selon le sexe","C’est normal si elle a des enfants","Seul le salarié le mieux payé peut se plaindre"],"L’égalité salariale est obligatoire.");
V("val","Un restaurateur refuse de vous servir à cause de votre origine. Que pouvez-vous faire ?",["Porter plainte ou saisir le Défenseur des droits : c’est une discrimination","Rien, un commerçant choisit ses clients","Exiger d’être servie en appelant le maire","Revenir accompagnée d’une personne française"],"Le refus de service discriminatoire est un délit.");
V("val","Sur un réseau social, vous lisez des messages appelant à la haine contre une religion. Que dit la loi ?",["L’incitation à la haine est un délit, même sur internet","Tout est permis sur internet","C’est autorisé si l’auteur est anonyme","C’est interdit seulement dans les journaux"],"On peut signaler ces contenus sur la plateforme Pharos.");
V("val","Un journal publie une caricature qui se moque d’une religion. Vous êtes choquée. Que permet la loi ?",["Le journal en a le droit : critiquer une religion relève de la liberté d’expression","Le journal doit être fermé par la police","Le dessinateur doit s’excuser publiquement","La caricature est interdite si des croyants sont choqués"],"Le blasphème n’est pas un délit en France. L’appel à la haine contre des personnes, lui, est interdit.");
V("val","Votre fils de 16 ans vous annonce qu’il ne croit plus en la religion de la famille. Que garantit la République ?",["La liberté de conscience : il est libre de croire ou de ne pas croire","Les parents décident de la religion de l’enfant jusqu’à 25 ans","Il doit attendre sa majorité pour changer d’avis","L’école doit le convaincre de garder sa religion"],"Chacun est libre de ses convictions.");
V("val","Vous souhaitez créer une association culturelle dans votre quartier. Que devez-vous faire ?",["La déclarer en préfecture : la création d’une association est libre","Demander l’autorisation du président de la République","Avoir la nationalité française","Attendre cinq ans de résidence en France"],"C’est la loi de 1901 sur la liberté d’association.");
V("val","Un collègue vous propose de rejoindre un syndicat. Votre employeur peut-il vous l’interdire ?",["Non, la liberté syndicale est un droit","Oui, dans les petites entreprises","Oui, pendant la période d’essai","Oui, si vous êtes étrangère"],"Tout salarié peut adhérer au syndicat de son choix.");
V("val","Lors d’une cérémonie officielle, La Marseillaise est jouée. Quelle attitude est attendue ?",["Une attitude respectueuse : l’outrage à l’hymne national est puni","Aucune règle n’existe","Il est obligatoire de la chanter","Seuls les Français doivent se lever"],"L’hymne et le drapeau sont des symboles protégés.");
V("val","Une amie vous dit que son employeur refuse d’embaucher des personnes handicapées. Qu’en est-il ?",["C’est une discrimination interdite par la loi","L’employeur est libre de son choix","C’est autorisé dans les petites entreprises","C’est autorisé si le poste est fatigant"],"Le handicap est un critère de discrimination interdit.");
V("val","Deux hommes souhaitent se marier à la mairie de votre commune. Le maire peut-il refuser parce qu’ils sont de même sexe ?",["Non, le mariage est ouvert aux couples de même sexe","Oui, chaque maire décide","Oui, si des habitants s’y opposent","Oui, dans les petites communes"],"Depuis la loi de 2013.");
V("val","Votre voisine, mariée, veut ouvrir un compte bancaire à son nom. A-t-elle besoin de l’autorisation de son mari ?",["Non, chaque époux peut ouvrir un compte librement","Oui, pour un compte personnel","Oui, si elle ne travaille pas","Oui, la première année de mariage"],"Chaque époux gère librement ses revenus.");
V("val","Un parent demande à l’école publique de dispenser sa fille des cours de natation pour un motif religieux. Que répond l’école ?",["Les cours sont obligatoires : aucune dispense pour motif religieux","La dispense est accordée automatiquement","La dispense dépend de l’âge de l’élève","L’école organise un cours séparé"],"L’assiduité s’applique à tous les enseignements.");
V("val","Dans la rue, une personne porte un vêtement qui cache entièrement son visage. Que dit la loi ?",["Il est interdit de dissimuler son visage dans l’espace public","C’est autorisé partout","C’est interdit seulement dans les magasins","C’est interdit seulement pour les étrangers"],"C’est la loi de 2010.");
V("val","Dans la rue, une femme porte un foulard qui laisse son visage visible. Est-ce autorisé ?",["Oui, on peut porter un signe religieux dans l’espace public","Non, c’est interdit dans la rue","Seulement près des lieux de culte","Seulement avec une autorisation"],"La neutralité s’impose aux agents publics, pas aux passants.");
V("val","Vous êtes salariée d’une entreprise privée et vous souhaitez vous absenter pour une fête religieuse. Que devez-vous faire ?",["Demander l’autorisation de votre employeur, qui peut refuser pour le bon fonctionnement de l’entreprise","Vous absenter sans prévenir, c’est un droit","Prévenir seulement vos collègues","Demander l’autorisation à la mairie"],"Le refus ne doit pas être discriminatoire.");
V("val","Un employé de mairie distribue les tracts d’un candidat pendant son service. Est-ce normal ?",["Non, les agents publics doivent rester neutres pendant leur service","Oui, s’il soutient le maire","Oui, en dehors de son bureau","Oui, c’est la liberté d’expression"],"La neutralité est aussi politique.");
V("val","Un propriétaire refuse de louer son logement à une famille parce qu’elle est étrangère. Est-ce légal ?",["Non, c’est une discrimination punie par la loi","Oui, le propriétaire choisit librement","Oui, si la famille n’a pas la nationalité française","Oui, pour un logement privé"],"La victime peut saisir le Défenseur des droits.");
V("val","Un ami vous dit : « En France, il y a une religion d’État. » Est-ce exact ?",["Non, la France est une République laïque","Oui, c’est le catholicisme","Oui, depuis la Révolution","Oui, depuis 1905"],"Depuis 1905, l’État ne reconnaît aucun culte.");
V("val","Votre fille veut jouer dans l’équipe de football de son collège. Peut-on lui refuser parce que c’est une fille ?",["Non, les activités scolaires sont ouvertes aux filles et aux garçons","Oui, pour les sports collectifs","Oui, si les garçons sont majoritaires","Oui, avec l’accord du directeur"],"L’école garantit l’égalité entre les filles et les garçons.");
V("val","Une collègue est moquée tous les jours à cause de son accent. Que peut-elle faire ?",["Alerter son employeur ou les représentants du personnel : le harcèlement est interdit","Rien, ce n’est pas grave","Changer d’accent","Démissionner, c’est la seule solution"],"L’employeur doit protéger ses salariés.");
V("val","Vous voyez l’affiche électorale d’un parti dont vous n’aimez pas les idées. Pouvez-vous l’arracher ?",["Non, les partis s’expriment librement et dégrader une affiche est interdit","Oui, c’est la liberté d’expression","Oui, si le parti est petit","Oui, après l’élection seulement"],"Le pluralisme politique est protégé.");
V("val","Une personne âgée de votre immeuble vit seule et ne sort plus. Quelle attitude correspond à la fraternité ?",["Prendre de ses nouvelles et prévenir les services sociaux si besoin","Ne pas s’en mêler","Attendre que sa famille s’en occupe","Demander son expulsion"],"La fraternité, c’est la solidarité au quotidien.");
V("val","Un maire refuse de marier un couple parce que la future épouse est étrangère. Est-ce légal ?",["Non, on ne peut pas refuser un mariage en raison de la nationalité","Oui, c’est son droit","Oui, si elle vit en France depuis moins de cinq ans","Oui, avec l’accord du préfet"],"La liberté de se marier est un droit fondamental.");
V("val","Dans un stade, des supporters lancent des cris racistes contre un joueur. Que dit la loi ?",["C’est un délit puni par la loi","C’est toléré dans les stades","C’est autorisé si l’équipe perd","Seul l’arbitre peut décider"],"Le racisme est puni partout, y compris dans les stades.");

V("dro","La police vous contrôle dans la rue et vous demande vos papiers. Que faites-vous ?",["Je présente mon titre de séjour et je reste calme","Je refuse tant que je n’ai pas d’avocat","Je pars, le contrôle n’est pas obligatoire","J’exige de voir un juge immédiatement"],"Une personne étrangère doit pouvoir présenter son titre de séjour.");
V("dro","Un magazine publie votre photo sans votre autorisation. Que pouvez-vous faire ?",["Faire valoir votre droit à l’image et, si besoin, saisir la justice","Rien, la presse a tous les droits","Aller détruire les magazines","Publier une photo du journaliste"],"Le droit à l’image protège la vie privée.");
V("dro","Vous êtes témoin d’un accident de la route avec des blessés. Que devez-vous faire en premier ?",["Sécuriser les lieux et alerter les secours (15, 18 ou 112)","Déplacer les blessés dans votre voiture","Prendre des photos pour l’assurance","Continuer votre route, les secours viendront"],"Protéger, alerter, secourir.");
V("dro","Votre voisine vous confie que son mari la frappe. Que pouvez-vous lui conseiller ?",["Appeler le 3919 ou le 17 et porter plainte","Attendre que la situation s’arrange","Régler cela en famille","Ne rien dire pour protéger les enfants"],"Les violences conjugales sont punies par la loi.");
V("dro","Vous recevez votre avis d’imposition et vous pensez qu’il contient une erreur. Que faites-vous ?",["Je contacte le centre des impôts pour faire une réclamation","Je ne paie pas","Je jette l’avis","J’attends l’année suivante"],"On peut réclamer, mais on ne peut pas ignorer l’impôt.");
V("dro","Un employeur vous propose de travailler sans être déclarée pour « gagner plus ». Que répondez-vous ?",["Je refuse : le travail non déclaré est illégal et ne donne aucun droit","J’accepte si le salaire est élevé","J’accepte pour une période d’essai","J’accepte si c’est moins de 20 heures par semaine"],"Sans déclaration : pas de protection sociale, pas de retraite.");
V("dro","Votre enfant de 10 ans ne veut plus aller à l’école. Que dit la loi ?",["L’instruction est obligatoire : les parents doivent veiller à sa scolarité","L’enfant décide à partir de 10 ans","Les parents peuvent attendre le collège","L’école n’est obligatoire qu’à partir de 12 ans"],"L’instruction est obligatoire de 3 à 16 ans.");
V("dro","Vous êtes convoquée au tribunal comme témoin. Que devez-vous faire ?",["Vous présenter et dire la vérité","Envoyer une lettre d’excuse","Refuser, témoigner n’est jamais obligatoire","Demander à un proche de vous remplacer"],"Le faux témoignage est puni par la loi.");
V("dro","On vous propose de l’argent pour un mariage « blanc » afin d’obtenir des papiers. Que dit la loi ?",["C’est un délit puni de prison et d’amende","C’est légal si les deux personnes sont d’accord","C’est toléré une seule fois","C’est légal avec un contrat"],"Le mariage doit reposer sur un vrai consentement.");
V("dro","Un ami vous propose d’acheter un téléphone que vous savez volé. Que risquez-vous ?",["Des poursuites pour recel : c’est un délit","Rien, seul le voleur est coupable","Rien si vous payez en espèces","Une simple remarque de la police"],"Acheter un objet que l’on sait volé s’appelle le recel.");
V("dro","Votre voisin écoute de la musique très fort toutes les nuits. Quelle est la bonne démarche ?",["Lui en parler, puis contacter la police ou la mairie si cela continue","Couper son électricité","Faire encore plus de bruit","Entrer chez lui pour éteindre la musique"],"Le tapage nocturne est une infraction.");
V("dro","Vous pensez qu’un enfant de votre immeuble est maltraité. Que pouvez-vous faire ?",["Appeler le 119, le numéro de l’enfance en danger","Ne rien faire, c’est une affaire de famille","Appeler le 3919","Attendre d’avoir des preuves filmées"],"Le 119 est gratuit et ouvert jour et nuit.");
V("dro","Votre employeur vous impose de nombreuses heures supplémentaires sans les payer. Que pouvez-vous faire ?",["Contacter l’inspection du travail ou les représentants du personnel","Accepter, l’employeur décide de tout","Démissionner sans rien dire","Appeler le 15"],"Le droit du travail protège les salariés.");
V("dro","Vous déménagez dans une autre ville. Quelle démarche concerne votre titre de séjour ?",["Signaler votre changement d’adresse à l’administration","Aucune, le titre reste valable sans démarche","Demander un nouveau visa","Rendre votre titre à la mairie"],"Le changement d’adresse se déclare en ligne ou en préfecture.");
V("dro","Un commerçant vous insulte. Vous êtes très en colère. Quelle réaction est conforme à la loi ?",["Garder votre calme et, si nécessaire, porter plainte","Casser sa vitrine","Le menacer pour qu’il s’excuse","Revenir avec des amis pour l’intimider"],"Nul ne peut se faire justice soi-même.");
V("dro","Vous êtes victime d’un vol dans le métro. Où pouvez-vous porter plainte ?",["Dans un commissariat de police ou une brigade de gendarmerie","À la mairie","À la préfecture","Uniquement au tribunal, avec un avocat"],"Une pré-plainte en ligne est aussi possible.");
V("dro","Vous êtes poursuivie en justice mais vous n’avez pas les moyens de payer un avocat. Que pouvez-vous demander ?",["L’aide juridictionnelle","Rien, il faut se défendre seule","Un prêt à la CAF","L’annulation du procès"],"L’État prend en charge tout ou partie des frais selon les revenus.");
V("dro","Un ami veut conduire une voiture alors qu’il n’a pas le permis. Que dit la loi ?",["Conduire sans permis est un délit","C’est autorisé sur de courtes distances","C’est autorisé avec un adulte à côté, sans formation","C’est autorisé la nuit"],"Il faut un permis valide et un véhicule assuré.");
V("dro","Vous trouvez des déchets abandonnés dans une forêt. Qui est en infraction ?",["La personne qui les a déposés : le dépôt sauvage est puni par la loi","Personne, la forêt appartient à tous","Uniquement la mairie","Le premier promeneur qui les voit"],"Chacun doit protéger l’environnement.");
V("dro","Le titre de séjour d’un ami expire dans deux mois. Que lui conseillez-vous ?",["Demander le renouvellement avant l’expiration","Attendre l’expiration pour faire la demande","Ne rien faire, le renouvellement est automatique","Quitter la France et revenir"],"Être en situation régulière est une obligation.");
V("dro","Lors d’un contrôle dans le bus, vous n’avez pas de titre de transport. Que se passe-t-il ?",["Vous devez payer une amende","Rien si c’est la première fois","Le contrôleur vous offre un ticket","Vous êtes conduite directement au tribunal"],"Voyager sans titre de transport est une infraction.");
V("dro","Votre chien mord un passant. Qui est responsable ?",["Vous, en tant que propriétaire","Le passant","La mairie","Personne, c’est un accident"],"Le propriétaire répond des dommages causés par son animal.");
V("dro","Un collègue vous envoie des messages à caractère sexuel malgré vos refus. De quoi s’agit-il ?",["De harcèlement sexuel, puni par la loi","D’une simple plaisanterie","D’un comportement toléré entre collègues","D’un problème qui ne concerne pas la justice"],"On peut alerter l’employeur et porter plainte.");
V("dro","Vous souhaitez organiser une manifestation avec une association. Quelle règle s’applique ?",["La manifestation doit être déclarée à l’avance aux autorités","Aucune règle, manifester est totalement libre","Il faut l’accord de tous les habitants","Les étrangers n’ont pas le droit de manifester"],"La déclaration se fait à la mairie ou à la préfecture.");
V("dro","Votre voisin a installé une caméra qui filme l’intérieur de votre jardin. Quel droit est atteint ?",["Le droit au respect de la vie privée","La liberté de circulation","Le droit de propriété du voisin","La liberté d’expression"],"Filmer chez autrui sans accord est interdit.");
V("dro","Une amie vous raconte que son mari lui interdit de sortir et lui confisque son téléphone. De quoi s’agit-il ?",["De violences psychologiques, punies par la loi","D’une dispute normale","D’un droit du mari","D’une affaire qui ne regarde pas la justice"],"Elle peut appeler le 3919 ou le 17.");
V("dro","Vous avez eu de faibles revenus cette année. Devez-vous faire une déclaration de revenus ?",["Oui, la déclaration est obligatoire chaque année, même avec de faibles revenus","Non, seulement au-dessus du SMIC","Non, l’employeur s’en charge entièrement","Seulement une année sur deux"],"La déclaration permet aussi d’obtenir certains droits et aides.");
V("dro","Un de vos proches est placé en garde à vue. Quel est l’un de ses droits ?",["Être assisté par un avocat","Rentrer chez lui quand il le souhaite","Choisir le policier qui l’interroge","Refuser de donner son identité"],"Il peut aussi faire prévenir un proche et voir un médecin.");
V("dro","Vous trouvez dans la rue un portefeuille avec de l’argent et des papiers. Que devez-vous faire ?",["Le remettre au commissariat ou au service des objets trouvés","Garder l’argent et rendre les papiers","Le laisser sur place","Le garder un an avant de le rendre"],"Garder un objet trouvé peut être considéré comme un vol.");
V("dro","Un ami vous dit qu’il n’a pas à respecter la loi française car il vient d’arriver. A-t-il raison ?",["Non, la loi s’applique à toutes les personnes présentes en France","Oui, pendant la première année","Oui, s’il ne parle pas français","Oui, s’il a un visa touristique"],"Nul n’est censé ignorer la loi.");
V("dro","Vous êtes locataire. Le propriétaire veut entrer dans votre logement en votre absence, sans votre accord. Que dit la loi ?",["Il n’en a pas le droit : le logement loué est votre domicile","Il peut entrer quand il veut","Il peut entrer une fois par mois","Il peut entrer s’il prévient les voisins"],"Le domicile est protégé par la loi.");

/* ===== Français niveau B2 (à part) =====

const B2_RAW = [
{k:"a",x:"Selon une enquête publiée ce matin, près d’un salarié sur trois souhaiterait télétravailler davantage. Pourtant, les entreprises restent prudentes : elles craignent une baisse de la cohésion des équipes, même si la productivité, elle, ne semble pas en souffrir.",q:"Que craignent les entreprises ?",o:["Que les équipes soient moins soudées","Que la productivité baisse","Que les salariés démissionnent","Que le télétravail coûte trop cher"],e:"La cohésion = le fait d’être unis. La productivité, elle, ne baisse pas."},
{k:"a",x:"Je comprends votre déception, madame, mais comme indiqué dans nos conditions de vente, les articles soldés ne sont ni repris ni échangés. Je peux en revanche vous proposer un avoir si l’article présente un défaut.",q:"Que propose le vendeur ?",o:["Un avoir, seulement si l’article a un défaut","Un remboursement immédiat","Un échange contre un autre article","Rien du tout"],e:"« En revanche » introduit ce qu’il peut faire. Un avoir = un bon d’achat."},
{k:"a",x:"Le maire a annoncé hier soir que le projet de nouvelle piscine serait reporté d’au moins deux ans, faute de financements suffisants. L’opposition dénonce une promesse non tenue, tandis que les associations sportives se disent déçues mais pas surprises.",q:"Pourquoi le projet est-il reporté ?",o:["Par manque d’argent","À cause de l’opposition","Parce que les associations n’en veulent pas","Parce que les travaux ont pris du retard"],e:"« Faute de financements » = par manque d’argent."},
{k:"a",x:"Franchement, au début, je n’étais pas convaincue par ce cours en ligne. Mais force est de constater que j’ai progressé plus vite qu’en présentiel : je peux revoir les leçons autant de fois que je veux. Le seul bémol, c’est le manque d’échanges avec les autres.",q:"Quel inconvénient mentionne-t-elle ?",o:["Le manque de contacts avec les autres élèves","Le prix du cours","La difficulté des leçons","La lenteur de ses progrès"],e:"Un bémol = un petit défaut."},
{k:"a",x:"En raison d’un mouvement social, le trafic sera fortement perturbé demain sur l’ensemble du réseau. Un train sur deux circulera aux heures de pointe, et aucun en milieu de journée. Les voyageurs sont invités à reporter leurs déplacements dans la mesure du possible.",q:"Que conseille-t-on aux voyageurs ?",o:["De remettre leur voyage à plus tard s’ils le peuvent","De prendre le train en milieu de journée","D’arriver très en avance","De demander un remboursement"],e:"Un mouvement social = une grève. Reporter = remettre à plus tard."},
{k:"a",x:"Contrairement aux idées reçues, les jeunes lisent toujours autant, mais différemment : moins de romans, davantage de bandes dessinées et d’articles sur écran. C’est ce que révèle une étude menée auprès de trois mille lycéens.",q:"Que montre l’étude ?",o:["Les jeunes lisent autant qu’avant, mais sur d’autres supports","Les jeunes ne lisent plus","Les jeunes lisent surtout des romans","Les écrans ont remplacé toute lecture"],e:"« Contrairement aux idées reçues » annonce une information qui surprend."},
{k:"a",x:"Bonjour, je vous appelle au sujet de l’annonce pour le poste d’assistante. J’ai bien noté que vous exigiez trois ans d’expérience ; je n’en ai que deux, mais dans un poste très similaire. Serait-il possible d’obtenir tout de même un entretien ?",q:"Quelle est la difficulté de la candidate ?",o:["Elle a moins d’expérience que ce qui est demandé","Elle n’a pas le bon diplôme","Elle habite trop loin","Elle n’est pas disponible"],e:"Deux ans au lieu de trois."},
{k:"a",x:"Les médecins tirent la sonnette d’alarme : le manque de sommeil chez les adolescents aurait doublé en dix ans. En cause, selon eux, l’usage des écrans le soir, qui retarde l’endormissement et nuit à la concentration en classe.",q:"Quelle cause est avancée ?",o:["L’utilisation des écrans le soir","Les devoirs trop nombreux","Le bruit dans les villes","Le sport pratiqué trop tard"],e:"« En cause » = le responsable, c’est…"},
{k:"a",x:"Je ne dis pas que ce quartier est désagréable, loin de là. Simplement, depuis l’ouverture du centre commercial, les petits commerces ferment les uns après les autres, et c’est tout de même une part de son âme qui s’en va.",q:"Que regrette la personne ?",o:["La disparition des petits commerces","Le bruit du quartier","Le prix des loyers","L’ouverture tardive des magasins"],e:"« Loin de là » = pas du tout. Elle aime le quartier, mais regrette ses commerces."},
{k:"a",x:"Suite à votre réclamation, nous avons procédé à une vérification de votre facture. Il apparaît qu’une erreur s’est effectivement glissée dans le calcul. Le trop-perçu vous sera remboursé sous dix jours ouvrés.",q:"Que va-t-il se passer ?",o:["La somme payée en trop sera remboursée","La facture sera augmentée","Le client doit payer sous dix jours","La réclamation est refusée"],e:"Le trop-perçu = l’argent payé en trop."},
{k:"a",x:"Si la municipalité a choisi de limiter la vitesse à trente kilomètres-heure, ce n’est pas pour sanctionner les automobilistes, comme certains le prétendent, mais bien pour réduire le nombre d’accidents et le bruit en centre-ville.",q:"Quel est le but de cette mesure ?",o:["Réduire les accidents et le bruit","Punir les automobilistes","Gagner de l’argent avec les amendes","Interdire les voitures"],e:"« Ce n’est pas pour… mais bien pour… » : la vraie raison vient après « mais »."},
{k:"a",x:"J’aurais aimé vous donner une réponse favorable, mais votre dossier est arrivé après la date limite. Je vous invite à présenter une nouvelle demande lors de la prochaine session, en janvier.",q:"Pourquoi la demande est-elle refusée ?",o:["Le dossier a été envoyé trop tard","Le dossier est incomplet","La personne n’a pas le niveau","Il n’y a plus de session"],e:"Après la date limite = trop tard."},

{k:"r",q:"« Le bénévolat séduit de plus en plus d’actifs. Loin de se limiter aux retraités, il attire désormais des trentenaires en quête de sens, qui y consacrent quelques heures par mois malgré un emploi du temps chargé. » D’après ce texte, les nouveaux bénévoles…",o:["travaillent et cherchent à donner du sens à leur vie","sont surtout des retraités","n’ont pas d’emploi","s’engagent à plein temps"],e:"Les actifs = les personnes qui travaillent."},
{k:"r",q:"« Bien que la ville ait investi dans de nouvelles pistes cyclables, le nombre de cyclistes n’a que faiblement augmenté. Les habitants invoquent le manque de stationnements sécurisés. » Pourquoi le vélo progresse-t-il peu ?",o:["Il manque des endroits sûrs pour garer les vélos","Il n’y a pas de pistes cyclables","Les vélos sont trop chers","La ville n’a rien investi"],e:"Invoquer = donner comme raison."},
{k:"r",q:"Courrier : « Nous accusons réception de votre demande. Faute de pièces justificatives, celle-ci ne pourra être instruite. Nous vous prions de nous les transmettre dans un délai de quinze jours, sans quoi votre dossier sera classé sans suite. » Que doit faire le destinataire ?",o:["Envoyer les documents manquants sous quinze jours","Attendre une réponse","Refaire une demande dans quinze jours","Rien, le dossier est accepté"],e:"« Sans quoi » = sinon. Classé sans suite = abandonné."},
{k:"r",q:"« L’essor du commerce en ligne n’a pas tué les librairies indépendantes, comme on le prédisait. Celles-ci ont su se réinventer en misant sur le conseil et les rencontres avec les auteurs. » Selon l’auteur, les librairies…",o:["ont résisté grâce au conseil et aux animations","ont presque toutes disparu","vendent surtout en ligne","ont baissé leurs prix"],e:"Miser sur = compter sur."},
{k:"r",q:"« Certes, le télétravail offre une réelle souplesse. Il n’en demeure pas moins qu’il peut isoler les salariés les plus fragiles. » Quelle est l’opinion de l’auteur ?",o:["Le télétravail a des avantages, mais aussi un risque d’isolement","Le télétravail est parfait","Le télétravail devrait être interdit","Le télétravail n’a aucun avantage"],e:"« Certes… il n’en demeure pas moins que… » : on reconnaît un point, puis on nuance."},
{k:"r",q:"Annonce : « Poste à pourvoir dès que possible. Rémunération selon profil. Une première expérience dans la vente serait un atout. » Que comprend-on ?",o:["Le salaire dépend du candidat et l’expérience est un plus","Le salaire est fixe","L’expérience est obligatoire","Le poste commence dans un an"],e:"Un atout = un avantage, pas une obligation."},
{k:"r",q:"« À force de vouloir tout faire trop vite, on finit par ne plus rien faire correctement », rappelle un sociologue. Que veut-il dire ?",o:["La précipitation nuit à la qualité","Il faut travailler plus vite","On ne fait jamais rien correctement","La lenteur est un défaut"],e:"« À force de » = parce qu’on le fait trop."},
{k:"r",q:"« Les loyers ont augmenté de 4 % en un an dans les grandes villes, alors même que les salaires stagnent. Résultat : de nombreux ménages s’éloignent des centres. » Quelle conséquence est décrite ?",o:["Des familles partent vivre plus loin des centres-villes","Les salaires augmentent","Les loyers baissent","Les centres-villes se remplissent"],e:"Stagner = ne pas bouger. Un ménage = une famille, un foyer."},
{k:"r",q:"Règlement : « Tout retard supérieur à quinze minutes devra être justifié auprès du responsable. À défaut, il sera décompté du temps de travail. » Que se passe-t-il pour un retard de vingt minutes non justifié ?",o:["Il est retiré du temps de travail","Rien","Le salarié est licencié","Le salarié doit rester le soir"],e:"« À défaut » = si ce n’est pas fait."},
{k:"r",q:"« Contre toute attente, la fréquentation des musées a bondi cet été, portée par les visiteurs locaux plutôt que par les touristes étrangers. » Qu’est-ce qui est surprenant ?",o:["La hausse vient des habitants, pas des touristes","Les musées étaient fermés","Les touristes étrangers étaient plus nombreux","La fréquentation a baissé"],e:"« Contre toute attente » = ce n’était pas prévu."},
{k:"r",q:"« Je ne partage pas l’enthousiasme général pour ce film : si les images sont superbes, l’histoire, elle, manque cruellement d’originalité. » L’auteur de la critique…",o:["admire les images mais trouve l’histoire banale","adore le film","déteste les images","n’a pas vu le film"],e:"« Si… , … elle » : ici, « si » marque une opposition."},
{k:"r",q:"« Sous réserve de disponibilité, votre commande sera expédiée sous 48 heures. » Cela signifie que…",o:["l’envoi se fera en 48 heures si le produit est en stock","l’envoi est garanti en 48 heures","la commande est annulée","il faut réserver le produit"],e:"« Sous réserve de » = à condition que."},

{k:"g",q:"Bien qu’il … fatigué, il a continué à travailler.",o:["soit","est","sera","était"],e:"Bien que + subjonctif."},
{k:"g",q:"Je doute qu’elle … à l’heure.",o:["vienne","vient","viendra","venait"],e:"Douter que + subjonctif."},
{k:"g",q:"Si j’avais su, je … venue plus tôt.",o:["serais","suis","serai","étais"],e:"Si + plus-que-parfait → conditionnel passé (je serais venue)."},
{k:"g",q:"Il a réussi son examen … ses difficultés.",o:["malgré","bien que","pourtant","cependant"],e:"Malgré + nom. Bien que + verbe au subjonctif."},
{k:"g",q:"Elle a beaucoup travaillé ; …, elle a obtenu son diplôme.",o:["par conséquent","pourtant","en revanche","malgré"],e:"Par conséquent = donc (la conséquence)."},
{k:"g",q:"C’est le collègue … je t’ai parlé.",o:["dont","que","qui","où"],e:"Parler de quelqu’un → dont."},
{k:"g",q:"Il faut que nous … une décision rapidement.",o:["prenions","prenons","prendrons","prendre"],e:"Il faut que + subjonctif : que nous prenions."},
{k:"g",q:"… il pleuve, nous sortirons quand même.",o:["Bien qu’","Parce qu’","Puisqu’","Dès qu’"],e:"« Pleuve » est au subjonctif : seul « bien que » le demande ici."},
{k:"g",q:"Elle parle comme si elle … tout.",o:["savait","sait","saura","sache"],e:"Comme si + imparfait."},
{k:"g",q:"Après … mangé, ils sont partis.",o:["avoir","être","ayant","avaient"],e:"Après + infinitif passé : après avoir mangé."},
{k:"g",q:"Les lettres ont été … hier.",o:["envoyées","envoyé","envoyer","envoyés"],e:"Voix passive : accord avec « les lettres » (féminin pluriel)."},
{k:"g",q:"Je cherche quelqu’un qui … parler arabe et français.",o:["sache","sait","saura","savoir"],e:"On cherche une personne qui n’est pas encore trouvée : subjonctif."},
{k:"v",q:"« Néanmoins » a le même sens que…",o:["cependant","donc","parce que","ensuite"],e:"Néanmoins, cependant, toutefois, pourtant : l’opposition."},
{k:"v",q:"« Faute de temps » signifie…",o:["par manque de temps","grâce au temps","avec le temps","au fil du temps"],e:"Faute de = par manque de."},
{k:"v",q:"« Un atout », c’est…",o:["un avantage","un défaut","une obligation","une erreur"],e:"« Parler deux langues est un atout. »"},
{k:"v",q:"« Être débordé », c’est…",o:["avoir trop de travail","être en retard","être malade","être en vacances"],e:"« Je suis débordée en ce moment. »"},
{k:"v",q:"« En revanche » exprime…",o:["une opposition","une cause","un but","une conséquence"],e:"En revanche = par contre."},
{k:"v",q:"« Il s’avère que » signifie…",o:["on constate que","il est faux que","il est possible que","on espère que"],e:"« Il s’avère que la facture était fausse. »"},
{k:"v",q:"« Mettre en œuvre un projet », c’est…",o:["le réaliser","l’abandonner","le critiquer","l’imaginer"],e:"Mettre en œuvre = passer à l’action."},
{k:"v",q:"« Une idée reçue », c’est…",o:["une opinion très répandue, souvent fausse","une idée nouvelle","un cadeau","une loi"],e:"« Contrairement aux idées reçues… »"}
];
const ECRIRE_B2 = [
 {t:1,min:30,max:60,c:"Vous écrivez à une collègue pour lui demander de vous remplacer vendredi. Expliquez pourquoi et proposez quelque chose en échange.",idees:["La demande, poliment","La raison","Ce que vous proposez en échange","Un remerciement"],ex:"Bonjour Claire, j’aurais un service à te demander : pourrais-tu me remplacer vendredi après-midi ? J’ai un rendez-vous à la préfecture que je ne peux pas déplacer. En échange, je prendrai volontiers ta permanence de lundi. Je te remercie d’avance pour ta compréhension. Bien à toi."},
 {t:1,min:30,max:60,c:"Vous répondez à l’annonce d’une association qui cherche des bénévoles. Présentez-vous et expliquez votre motivation.",idees:["Qui vous êtes","Vos disponibilités","Pourquoi cette association","Une formule de politesse"],ex:"Madame, Monsieur, votre annonce a retenu toute mon attention. Installée à Rennes depuis peu, je souhaiterais m’investir dans la vie locale. Disponible le samedi matin, je serais heureuse d’aider à la distribution alimentaire, car la solidarité me tient à cœur. Dans l’attente de votre réponse, je vous adresse mes salutations distinguées."},
 {t:2,min:40,max:90,c:"Sur un blog, vous racontez une expérience qui vous a marquée lors de votre arrivée dans une nouvelle ville.",idees:["Le contexte","Ce qui s’est passé","Ce que vous avez ressenti","Ce que vous en retenez"],ex:"Lorsque je suis arrivée à Rennes, je ne connaissais personne. Le premier soir, je me suis perdue en cherchant mon immeuble. Une dame âgée, voyant mon inquiétude, a tenu à m’accompagner jusqu’à ma porte, bien que ce ne soit pas son chemin. Nous avons bavardé tout le long du trajet. Ce geste m’a profondément touchée : j’ai compris que je pourrais me sentir chez moi ici. Depuis, nous prenons le thé ensemble chaque semaine."},
 {t:2,min:40,max:90,c:"Vous écrivez à un ami pour lui raconter un problème que vous avez eu avec une administration et comment vous l’avez résolu.",idees:["Le problème","Les démarches","La solution","Votre conseil"],ex:"Cher Karim, il faut que je te raconte ma mésaventure. Le mois dernier, la CAF a suspendu mon aide sans explication. Après plusieurs appels restés sans réponse, je me suis rendue sur place avec tous mes justificatifs. Il s’est avéré qu’un document n’avait pas été enregistré. Grâce à une conseillère très patiente, tout est rentré dans l’ordre en une semaine. Si cela t’arrive, déplace-toi directement, c’est bien plus efficace !"},
 {t:3,min:40,max:90,c:"Sur un forum : « Le télétravail est-il une bonne chose ? » Donnez votre opinion en la justifiant.",idees:["Votre position","Un argument pour","Une nuance ou un argument contre","Une conclusion"],ex:"À mon sens, le télétravail constitue un réel progrès, à condition d’être bien encadré. D’une part, il supprime les trajets et permet de mieux concilier vie professionnelle et vie familiale. D’autre part, il offre davantage de calme pour se concentrer. Cependant, il ne faut pas négliger le risque d’isolement : rien ne remplace les échanges avec les collègues. C’est pourquoi une formule mixte, avec deux ou trois jours au bureau, me paraît la solution la plus équilibrée."},
 {t:3,min:40,max:90,c:"Sur un site : « Faut-il limiter le temps d’écran des enfants ? » Donnez votre avis avec des arguments.",idees:["Votre position","Un premier argument","Un deuxième argument ou une nuance","Une conclusion"],ex:"Je suis convaincue qu’il est indispensable de limiter le temps d’écran des enfants. En effet, de nombreuses études montrent qu’un usage excessif nuit au sommeil et à la concentration. Par ailleurs, le temps passé devant une tablette est autant de temps en moins pour jouer dehors ou lire. Certes, les écrans peuvent être utiles pour apprendre. Néanmoins, c’est aux parents de fixer des règles claires, par exemple pas d’écran pendant les repas ni avant de dormir."},
 {t:3,min:40,max:90,c:"Sur un forum : « La ville ou la campagne : où vit-on le mieux en famille ? » Défendez votre point de vue.",idees:["Votre position","Les avantages","Les inconvénients de l’autre choix","Une conclusion nuancée"],ex:"Selon moi, la campagne offre un cadre de vie idéal pour une famille. Les enfants y disposent d’espace et grandissent au contact de la nature, loin de la pollution. De plus, les logements y sont nettement plus abordables. Il est vrai que la ville propose davantage de services et d’activités culturelles. Toutefois, avec une voiture et une bonne connexion à internet, ces inconvénients deviennent tout à fait supportables. Tout dépend, finalement, des priorités de chacun."}
];

// Distance à vol d’oiseau depuis Rennes (chez Hajar)
function distanceRennes(v){
  if(v.n==="Rennes") return "Chez vous !";
  const R=6371, rad=x=>x*Math.PI/180, dLat=rad(v.lat-RENNES.lat), dLon=rad(v.lon-RENNES.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(rad(RENNES.lat))*Math.cos(rad(v.lat))*Math.sin(dLon/2)**2;
  const km=Math.round(2*R*Math.asin(Math.sqrt(h))/10)*10;
  return "à "+km.toLocaleString("fr-FR")+" km de Rennes";
}
function miniCarte(v,actif){
  const coul = actif ? "#F2545B" : "#9AA6BC";
  let h=`<svg class="mini-carte" viewBox="-22 -2 132 104" role="img" aria-label="Carte : ${esc(nomVille(v))}, ${esc(distanceRennes(v))}">`;
  h+=`<path d="${D_FRANCE}" class="terre"/><path d="${D_CORSE}" class="terre"/>`;
  DOMS.forEach((d,k)=>{ const y=k*16; const on=v.dom===d.n; h+=`<rect x="-20" y="${y}" width="16" height="15" rx="3" class="case ${on?"on":""}"/><g class="terre">${d.f}</g>`; if(on) h+=`<circle cx="-12" cy="${y+7.5}" r="4.2" fill="${coul}" stroke="#fff" stroke-width="1.5"/>`; });
  // Rennes : la maison de Hajar
  const [rx,ry]=proj([RENNES.lon,RENNES.lat]);
  if(!v.dom && v.n!=="Rennes"){ const [x,y]=proj([v.lon,v.lat]); h+=`<line x1="${rx}" y1="${ry}" x2="${x}" y2="${y}" class="trajet"/>`; }
  h+=`<g transform="translate(${rx} ${ry})"><path d="M-5 1 L0 -4 L5 1 V6 H-5 Z" fill="#2D6CDF" stroke="#fff" stroke-width="1.2"/></g><text x="${(+rx)-1}" y="${(+ry)+14}" class="nom-rennes">Rennes</text>`;
  if(!v.dom){ const [x,y]=proj([v.lon,v.lat]); h+=`<circle cx="${x}" cy="${y}" r="${v.n==="Rennes"?7:5.5}" fill="${v.n==="Rennes"?"none":coul}" stroke="${v.n==="Rennes"?coul:"#fff"}" stroke-width="2"/>`; if(v.n==="Paris") h+=`<circle cx="${x}" cy="${y}" r="9" fill="none" stroke="${coul}" stroke-width="1.5"/>`; }
  return h+`</svg>`;
}

function tirageExamen(){

  for(const n in PLAN_EXAMEN){ let pool=shuffle(CIV.filter(x=>x.n===n && (n.endsWith("-sit")?x.v:!x.x))); if(pool.length<PLAN_EXAMEN[n]) pool=shuffle(CIV.filter(x=>x.n===n)); pool.slice(0,PLAN_EXAMEN[n]).forEach(x=>{ out.push(x); pris.add(x.id); }); }
  if(out.length<40){ shuffle(CIV.filter(x=>!pris.has(x.id))).slice(0,40-out.length).forEach(x=>out.push(x)); }

function appliquer(d){
  if(!d || typeof d!=="object") return;

  S.stars=Object.assign({civ:[],fr:[]},d.stars||{});

}

const DB_NOM="objectif-france", DB_TABLE="progression", DB_CLE="hajar";
function ouvrirDB(){ return new Promise((ok,ko)=>{ if(!window.indexedDB){ ko(); return; } const r=indexedDB.open(DB_NOM,1); r.onupgradeneeded=()=>r.result.createObjectStore(DB_TABLE); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }); }

// Notre photo à tous les deux, à la place de la mascotte. Le cadre change de couleur selon le résultat.
function mascotte(h,cls){ return `<img class="mascotte humeur-${h} ${cls||""}" src="${PHOTO}" alt="Notre photo">`; }
const COUL_FETE=["#2D6CDF","#FFC93C","#FF6B6B","#22B573","#8A4FE0","#FF8FD0","#3FD0F5"];
function confettis(n,x,y){
  if(reduced) return;
  const c=COUL_FETE;
  for(let i=0;i<(n||26);i++){ const d=document.createElement("div"); d.className="confetti"+(Math.random()<.3?" rond":"");
    if(x!==undefined){ d.style.left=x+"px"; d.style.top=y+"px"; }
    d.style.background=rnd(c); d.style.setProperty("--dx",(Math.random()*320-160)+"px"); d.style.setProperty("--dy",(Math.random()*-260+40)+"px"); d.style.setProperty("--r",(Math.random()*720-360)+"deg");
    document.body.appendChild(d); setTimeout(()=>d.remove(),1050); }
}
// Pluie de confettis sur tout l’écran
function pluie(n){
  if(reduced) return;
  for(let i=0;i<n;i++){ const d=document.createElement("div"); d.className="pluie"+(Math.random()<.35?" rond":"");
    d.style.left=(Math.random()*100)+"vw"; d.style.background=rnd(COUL_FETE);
    d.style.setProperty("--x",(Math.random()*120-60)+"px"); d.style.setProperty("--r",(Math.random()*1080-540)+"deg");
    d.style.setProperty("--d",(1.8+Math.random()*1.6)+"s"); d.style.setProperty("--delay",(Math.random()*0.9)+"s");
    document.body.appendChild(d); setTimeout(()=>d.remove(),4500); }
}
// Petit texte qui s’envole (ex. « Série x3 ! »)
function flottant(txt,x,y){
  const d=document.createElement("div"); d.className="flottant"; d.textContent=txt;
  d.style.left=x+"px"; d.style.top=y+"px"; document.body.appendChild(d); setTimeout(()=>d.remove(),1100);
}
// Grand écran de fête pour les gros succès
function celebrer(titre,sous,types){
  fanfare(); pluie(140);
  const d=document.createElement("div"); d.className="fete"; d.setAttribute("role","dialog"); d.setAttribute("aria-label",titre);
  d.innerHTML=`<div class="rayons"></div><div class="carte">${coco("fete","moyen")}${types?`<div class="icones">${types.map(t=>SVG[t]).join("")}</div>`:`<div class="icones">${star(true)}${star(true)}${star(true)}</div>`}<div class="gros">${esc(titre)}</div>${sous?`<div class="sous">${esc(sous)}</div>`:""}<div class="tap">Touche l’écran pour continuer</div></div>`;
  document.body.appendChild(d);
  let fini=false; const close=()=>{ if(fini) return; fini=true; d.classList.add("part"); setTimeout(()=>d.remove(),300); };
  d.onclick=close; setTimeout(close,4200);
}

/* ---------- Petits sons du jeu (doux) ---------- */
let actx=null;
function ctx(){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; if(!actx){ try{ actx=new AC(); }catch(e){ return null; } } if(actx.state==="suspended") actx.resume(); return actx; }
function note(f,dt,dur,vol,type){
  if(S.sons===false) return; const c=ctx(); if(!c) return;
  const t0=c.currentTime+dt, o=c.createOscillator(), g=c.createGain();
  o.type=type||"triangle"; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+0.05);
}
const ding=()=>{ note(1046.5,0,.25,.09); note(1568,.07,.4,.08); note(3136,.07,.25,.015,"sine"); };
const oups=()=>{ note(392,0,.18,.05,"sine"); note(311,.12,.3,.05,"sine"); };
const pling=i=>{ const f=[784,988,1175][i]||1175; note(f,0,.45,.08); note(f*2,0,.3,.02,"sine"); };
function fanfare(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>note(f,i*.11,.35,.08)); [523.25,659.25,783.99,1046.5].forEach(f=>note(f,.5,1.1,.045)); note(2093,.5,.8,.02,"sine"); }

/* ---------- Voix ----------
   1. Si un fichier audio enregistré existe (dossier audio/), on le joue : c’est une vraie voix.
   2. Sinon, on prend la voix française la plus naturelle du téléphone. */
let frVoices=[], frVoice=null;
function voiceScore(v){
  let s=0; const n=v.name;
  if(/^fr(-|_)FR/i.test(v.lang)) s+=4; else if(/^fr/i.test(v.lang)) s+=1;
  if(/natural|neural|premium|enhanced|amélior|naturel/i.test(n)) s+=12;
  if(/siri/i.test(n)) s+=9;
  if(/online/i.test(n)) s+=7;
  if(/google/i.test(n)) s+=6;
  if(/denise|vivienne|henri|eloise|remy|amélie|audrey|aurélie|thomas|marie|virginie/i.test(n)) s+=2;
  if(/compact|eloquence|espeak|eddy|flo|grandma|grandpa|grand-mère|grand-père|reed|rocko|sandy|shelley|jacques/i.test(n)) s-=10;
  if(v.localService===false) s+=1;
  return s;
}
function loadVoice(){
  if(!canSpeak) return;
  frVoices=speechSynthesis.getVoices().filter(x=>/^fr/i.test(x.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));
  frVoice=(S.voice && frVoices.find(v=>v.voiceURI===S.voice)) || frVoices[0] || null;
}
if(canSpeak){ loadVoice(); speechSynthesis.onvoiceschanged=loadVoice; }
// Découpe en phrases : des petites pauses rendent la voix plus naturelle
let speakId=0;
function speak(t,slow,voice){
  if(!canSpeak) return; stopAudio(); speechSynthesis.cancel();
  const id=++speakId; duck(true);
  const parts=t.replace(/…/g,"...").split(/(?<=[.!?])\s+/).filter(Boolean);
  parts.forEach((p,i)=>{ const u=new SpeechSynthesisUtterance(p); u.lang="fr-FR"; u.rate=slow?0.75:0.98; u.pitch=1; const v=voice||frVoice; if(v) u.voice=v;
    if(i===parts.length-1){ u.onend=u.onerror=()=>{ if(id===speakId) duck(false); }; }
    speechSynthesis.speak(u); });
}
// Vrais enregistrements : audio/ecoute-01.mp3 (ou .m4a), audio/phrase-01.mp3…
let audioEl=null, audioOK=null;
// On vérifie une seule fois si le dossier audio existe, pour ne pas perdre de temps
if(location.protocol!=="file:"){ (async()=>{ for(const ext of ["mp3","m4a"]){ try{ const r=await fetch("audio/ecoute-01."+ext,{method:"HEAD"}); if(r.ok){ audioOK=true; return; } }catch(e){} } audioOK=false; })(); }
function stopAudio(){ if(audioEl){ audioEl.pause(); audioEl.onerror=null; audioEl=null; } }
function fichiers(it){ return it.audio ? ["audio/"+it.audio+".mp3","audio/"+it.audio+".m4a"] : []; }
function playItem(it,text,slow){
  const list=fichiers(it);
  if(!list.length || location.protocol==="file:" || audioOK===false){ speak(text,slow); return; }
  if(canSpeak) speechSynthesis.cancel(); stopAudio();
  let k=0;
  const tryNext=()=>{
    if(k>=list.length){ audioEl=null; speak(text,slow); return; }
    const el=new Audio(list[k++]); audioEl=el;
    el.playbackRate=slow?0.75:1; el.preservesPitch=true;
    el.onerror=()=>{ if(audioEl===el) tryNext(); };
    el.onended=()=>{ if(audioEl===el) duck(false); };
    duck(true);
    el.play().catch(err=>{ if(audioEl===el && err && err.name!=="NotAllowedError") tryNext(); else if(audioEl===el && err && err.name==="NotAllowedError"){ /* le navigateur bloque la lecture auto : elle appuiera sur Écouter */ } });
  };
  tryNext();
}

/* ---------- Musique d’ambiance ----------
   Mets ta musique dans audio/musique.mp3 (ou .m4a). Elle tourne en boucle, doucement,
   et se baisse toute seule pendant les écoutes. */
const MUSIC_VOL=0.3, MUSIC_DUCK=0.04;
const mus={el:null, ctx:null, gain:null, ok:null};
let ducked=false;
if(location.protocol!=="file:"){ (async()=>{ for(const ext of ["mp3","m4a"]){ try{ const r=await fetch("audio/musique."+ext,{method:"HEAD"}); if(r.ok){ mus.ok="audio/musique."+ext; const b=document.querySelector('[data-act="musique"]'); if(b) b.hidden=false; return; } }catch(e){} } mus.ok=false; })(); }
function musicVol(v){
  if(mus.gain){ const t=mus.ctx.currentTime, g=mus.gain.gain; g.cancelScheduledValues(t); g.setValueAtTime(g.value,t); g.linearRampToValueAtTime(v,t+0.5); }
  else if(mus.el){ try{ mus.el.volume=v; }catch(e){} }
}
function musicStart(){
  if(!mus.ok || S.music===false) return;
  try{
    if(!mus.el){
      mus.el=new Audio(mus.ok); mus.el.loop=true; mus.el.preload="auto";
      const AC=window.AudioContext||window.webkitAudioContext;
      // Sur iPhone, le volume d’un lecteur audio ne se règle pas : on passe par Web Audio.
      if(AC){ mus.ctx=ctx(); const src=mus.ctx.createMediaElementSource(mus.el); mus.gain=mus.ctx.createGain(); mus.gain.gain.value=0; src.connect(mus.gain); mus.gain.connect(mus.ctx.destination); }
    }
    if(mus.ctx && mus.ctx.state==="suspended") mus.ctx.resume();
    mus.el.play().then(()=>musicVol(ducked?MUSIC_DUCK:MUSIC_VOL)).catch(()=>{});
  }catch(e){}
}
function musicStop(){ if(mus.el) mus.el.pause(); }
function duck(on){ ducked=on; if(mus.el && !mus.el.paused) musicVol(on?MUSIC_DUCK:MUSIC_VOL); }
document.addEventListener("pointerdown",()=>{ ctx(); if(mus.ok && S.music!==false && (!mus.el||mus.el.paused)) musicStart(); },{passive:true});
document.addEventListener("visibilitychange",()=>{ if(document.hidden) musicStop(); else if(mus.el && S.music!==false) musicStart(); });
function toggleMusic(b){
  S.music = S.music===false; save();
  if(S.music) musicStart(); else musicStop();
  b.classList.toggle("off", !S.music); b.querySelector("span").textContent = S.music?"Musique":"Musique coupée";
}

const fmt=ms=>{ const s=Math.max(0,Math.round(ms/1000)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };

/* Écran d’examen : reproduit la plateforme officielle (manuel du candidat, France Éducation international)

function showExamen(){
  closePanel(); hush();
  const cci = (G.w==="civ"||G.w==="cr") && centre()==="cci";
  if(!G.ordre){ G.ordre=G.qs.map((_,k)=>k); G.pos=0; G.valide=[]; }

  const cur=G.qs[G.i], it=cur.item, n=G.qs.length, faits=cci?G.choices.filter(x=>x!=null).length:n-G.ordre.length, civ=G.w==="civ"||G.w==="cr";
  let h=`<div class="exam-ecran"><div class="exam-entete"><div><b>${civ?"Examen civique":"Test de français"}</b><small>${G.w==="cr"?"Carte de résident":civ?"Carte de séjour pluriannuelle":G.w==="b2"?"Niveau B2 · compréhension orale et écrite":"Compréhension orale et écrite"}</small></div><button class="exam-quitter" data-act="quit">Quitter</button></div>
  <div class="exam-infos"><div><small>Temps restant</small><b class="chrono">${G.end?fmt(G.end-Date.now()):"–"}</b></div><div><small>${cci?"Question "+(G.i+1)+" · répondues":"Questions validées"}</small><b>${faits} / ${n}</b></div></div>
  <div class="exam-jauge"><div style="width:${faits/n*100}%"></div></div>
  <p class="exam-question">${esc(it.q)}</p>`;
  if(it.k==="a") h+= canSpeak ? `<button class="exam-ecouter" data-act="once" ${cur.ecoute?"disabled":""}>${ICO.son}<span>${cur.ecoute?"Message écouté":"Écouter le message (une seule fois)"}</span></button>` : `<p>« ${esc(it.x)} »</p>`;
  h+=`<div class="exam-options">${cur.opts.map((o,j)=>`<button class="exam-opt ${G.choices[G.i]===o?"choisie":""}" data-opt="${j}"><span class="radio"></span><span>${esc(o)}</span></button>`).join("")}</div>`;
  if(cci) h+=`<div class="exam-boutons"><button class="exam-passer" data-act="prec" ${G.i===0?"disabled":""}>Précédente</button><button class="exam-valider" data-act="suiv">${G.i+1<n?"Suivante":"Terminer l’examen"}</button></div>
   <div class="exam-grille">${G.qs.map((_,k)=>`<button class="${k===G.i?"ici":""} ${G.choices[k]!=null?"rep":""}" data-q="${k}">${k+1}</button>`).join("")}</div>
   <button class="exam-terminer" data-act="terminer">Terminer l’examen</button></div>`;
  else h+=`<div class="exam-boutons"><button class="exam-passer" data-act="passer" ${G.ordre.length<2?"disabled":""}>Question suivante</button><button class="exam-valider" data-act="valider">Valider la réponse</button></div></div>`;
  app.innerHTML=h; window.scrollTo(0,0);
  const on=(a2,f)=>{ const b=app.querySelector(`[data-act="${a2}"]`); if(b) b.onclick=f; };
  on("quit",()=>{ if(confirm("Quitter l’examen ? Il ne sera pas compté.")){ stopTimer(); home(); } });
  on("once",function(){ this.disabled=true; this.querySelector("span").textContent="Message écouté"; cur.ecoute=true; playItem(it,it.x,false); });
  app.querySelectorAll(".exam-opt").forEach(b=>b.onclick=()=>{ G.choices[G.i]=cur.opts[+b.dataset.opt]; app.querySelectorAll(".exam-opt").forEach(x=>x.classList.toggle("choisie",x===b)); });
  on("valider",()=>{ G.valide[G.i]=true; if(G.choices[G.i]===undefined) G.choices[G.i]=null; G.ordre.splice(G.pos,1); G.ordre.length?showExamen():finish(); });
  on("passer",()=>{ if(G.ordre.length<2) return; G.ordre.push(G.ordre.splice(G.pos,1)[0]); showExamen(); });
  // Variante CCI : navigation libre entre les questions
  const terminer=()=>{ const vides=G.qs.length-G.choices.filter(x=>x!=null).length; if(confirm(vides?"Il reste "+vides+" question"+(vides>1?"s":"")+" sans réponse. Terminer quand même ?":"Terminer l’examen ?")){ G.qs.forEach((_,k)=>{ G.valide[k]=true; }); finish(); } };
  on("prec",()=>{ if(G.i>0){ G.i--; showExamen(); } });
  on("suiv",()=>{ if(G.i+1<G.qs.length){ G.i++; showExamen(); } else terminer(); });
  on("terminer",terminer);

}
function show(){

  if(n>=10 && G.i===Math.floor(n/2) && !G.mi){ G.mi=true; setTimeout(()=>toast(G.exam?"À mi-chemin, tu gères !":"La moitié est faite, continue !"),300); }

  if(it.k==="o"){
    h+=`<p class="question">Remets les mots dans l’ordre.</p>`;

    if(it.k==="a" && G.exam && canSpeak) h+=`<div class="ecoute"><button class="haut-parleur" data-act="once">${ICO.son}Écouter (une seule fois)</button></div><p class="consigne" style="text-align:left;margin:.4rem 0 0">Comme au vrai test : le message passe une seule fois.</p>`;
    else if(it.k==="a") h+= canSpeak ? `<div class="ecoute"><button class="haut-parleur" data-act="play">${ICO.son}Écouter</button><button class="haut-parleur lent" data-act="slow">Plus lentement</button></div>` : `<p>« ${esc(it.x)} »</p>`;
    else if(canSpeak) h+=`<button class="lire" data-act="read">${ICO.son}Écouter la question</button>`;
    h+=`<div class="options">`; cur.opts.forEach((o,j)=>h+=`<button class="opt" data-opt="${j}">${esc(o)}</button>`); h+=`</div>`;
    if(G.exam) h+=`<div class="bas-fixe"><div class="inner"><div class="deux-boutons"><button class="btn b-white center" data-act="prev" ${G.i===0?"disabled":""}>Précédente</button><button class="btn b-mint center" data-act="next" ${G.choices[G.i]===undefined?"disabled":""}>${G.i+1<n?"Suivante":"Terminer"}</button></div></div></div>`;
  }
  app.innerHTML=h; window.scrollTo(0,0);
  G.done=false; G.choice=null;
  const on=(a,f)=>{ const b=app.querySelector(`[data-act="${a}"]`); if(b) b.onclick=f; };
  on("quit",()=>{ if(G.i===0||confirm("Arrêter la partie ? Tes réponses sont gardées.")){ G.mode==="stage"?monde(G.w):home(); } });
  if(it.k==="o"){ setupWords(cur); on("hint",()=>playItem(it,it.s,false)); on("check",checkWords); return; }
  on("play",()=>playItem(it,it.x,false)); on("slow",()=>playItem(it,it.x,true));
  on("read",()=>speak(it.q.replace(/…/g," ... ")+" ... "+cur.opts.join(" ... "),false));
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.opt));
  if(G.exam){
    if(G.choices[G.i]!==undefined) app.querySelectorAll(".opt").forEach((b,k)=>b.classList.toggle("choisie",cur.opts[k]===G.choices[G.i]));
    on("next",()=>{ hush(); if(G.i+1<G.qs.length){ G.i++; show(); } else if(confirm("Terminer l’examen et voir ton résultat ?")) finish(); });

/* Mots à remettre dans l’ordre */
function setupWords(cur){
  cur.placed=[]; const box=$("#mots"), ph=$("#phrase");
  const render=()=>{
    ph.innerHTML=cur.placed.map((wi,p)=>`<button class="mot" data-p="${p}">${esc(cur.mots[wi])}</button>`).join("")+(cur.end?`<span class="fin-phrase">${cur.end}</span>`:"");
    box.innerHTML=cur.mots.map((m,wi)=>cur.placed.includes(wi)?"":`<button class="mot" data-w="${wi}">${esc(m)}</button>`).join("");
    ph.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ if(G.done) return; cur.placed.splice(+b.dataset.p,1); render(); });
    box.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{ if(G.done) return; cur.placed.push(+b.dataset.w); render(); });
    app.querySelector('[data-act="check"]').disabled = cur.placed.length!==cur.mots.length;
  };
  render();
}
function checkWords(){
  const cur=G.qs[G.i], it=cur.item, made=cur.placed.map(i=>cur.mots[i]).join(" "), good=made===cur.core;
  if(G.exam){ scoreExam(good); return; }
  if(G.done) return; G.done=true;
  $("#phrase").classList.add(good?"bonne":"mauvaise"); if(!good) $("#phrase").classList.add("secoue");
  feedback(good, it, "");

}

const OUPS=["Presque !","Pas grave, maintenant tu la connais !","Tu vas la retenir, promis !","C’est en se trompant qu’on apprend !","Pas de souci, on continue !"];
const BRAVO=["Bravo !","Super !","Génial !","Tu gères !","Parfait !","Excellent !","Trop forte !"];

function answer(j){
  const cur=G.qs[G.i], it=cur.item, good=cur.opts[j]===it.o[0], btns=app.querySelectorAll(".opt");
  if(G.exam){ G.choices[G.i]=cur.opts[j]; btns.forEach((b,k)=>b.classList.toggle("choisie",k===j)); app.querySelector('[data-act="next"]').disabled=false; return; }

  const r=btns[j].getBoundingClientRect(); G.pt=[r.left+r.width/2, r.top+r.height/2];

const RETENUE=["Tu l’as retenue !","Bravo, c’est gravé dans ta tête !","Voilà, maintenant tu la connais !","Super mémoire !"];
const PAS_ENCORE=["Pas encore, mais ça va venir !","C’est normal, certaines réponses demandent plus de temps.","On la reverra dans « À revoir ». Tu vas y arriver !"];
function feedback(good,it,extra){
  const cur=G.qs[G.i], retry=!!cur.retry;
  record(it.id,good);
  let pts=0, titre;
  const pt=G.pt||[innerWidth/2, innerHeight*0.4]; G.pt=null;
  if(good && retry){ pts=5; G.xp+=pts; S.xp+=pts; save(); ding(); confettis(35, pt[0], pt[1]); G.wrong=G.wrong.filter(x=>x!==it); G.retenues=(G.retenues||0)+1; titre=rnd(RETENUE)+" +"+pts; }

    ding(); vibre(20); confettis(G.combo>=3?45:30, pt[0], pt[1]);
    if(G.combo>=3) flottant("Série x"+G.combo+" !", pt[0], pt[1]-30); titre=rnd(BRAVO)+" +"+pts; }
  else { G.combo=0; if(!G.wrong.includes(it)) G.wrong.push(it); oups(); titre=retry?rnd(PAS_ENCORE):rnd(OUPS);

  p+=`<p>${esc(it.e)}</p>`;

  if(!good && !retry) p+=`<p class="deuxieme">Elle va revenir dans quelques questions : deuxième chance !</p>`;
  if(it.k==="a") p+=`<p class="transcription">« ${esc(it.x)} »</p>`;

  panneau.className="panneau "+(good?"ok":"ko"); panneau.querySelector(".inner").innerHTML=p;

}
function scoreExam(good){
  const it=G.qs[G.i].item; record(it.id,good);

function finish(){
  stopTimer(); closePanel(); hush();

    titre = top?"Magnifique !":ok?"Examen réussi !":32-G.score<=4?"Tu y es presque !":"Bel entraînement !";

      : ok ? "Tu as plus de 32 : au vrai examen, c’est réussi ! Vise maintenant 36 pour être tranquille."+progres
      : "Il te manque "+(32-G.score)+" bonne"+(32-G.score>1?"s":"")+" réponse"+(32-G.score>1?"s":"")+" pour réussir. Chaque examen blanc te fait progresser."+progres;
  }
  else if(G.exam && w==="cr"){ const ok=G.score>=32; titre=ok?"Réussi, niveau carte de résident !":"Bel entraînement !"; verdict=ok?"Tu as 32 ou plus sur 40 : c’est le score demandé pour la carte de résident. Bravo !":"Ce niveau est plus difficile, il sert pour plus tard. Il te manque "+(32-G.score)+" bonne"+(32-G.score>1?"s":"")+" réponse"+(32-G.score>1?"s":"")+"."; }
  else if(G.exam){ titre=r>=0.8?"Excellent !":r>=0.6?"Très bien !":"Bel entraînement !"; verdict="Le vrai test a aussi une partie écrite et une partie orale : entraîne-toi avec « Écrire » et « Parler »."; }
  else { titre=nb===3?"Incroyable !":nb===2?"Très bien !":nb===1?"Bien joué !":"Courage !"; verdict=unlockMsg||(nb===0&&G.mode==="stage"?"Tu as appris de nouvelles choses ! Rejoue l’étape pour gagner une étoile et débloquer la suite.":G.best>=3?"Meilleure série : "+G.best+" bonnes réponses de suite.":"Les questions ratées sont dans « À revoir »."); }

function tirageCR(){
  const plan={val:5,ins:6,dro:5,his:8,vie:4}, out=[], B=WORLD.cr.bank;
  for(const t in plan) shuffle(B.filter(x=>x.t===t)).slice(0,plan[t]).forEach(x=>out.push(x));

/* ---------- Choix intelligent des questions ----------
   D’abord les questions jamais vues, puis les erreurs, puis les plus anciennes réussites. */
function filtre(x,f){
  if(!f) return true;
  if(f.t && x.t!==f.t) return false;
  if(f.s===0 && x.s) return false;
  if(f.s===1 && !x.s) return false;
  if(f.k && x.k!==f.k) return false;
  if(f.ks && !f.ks.includes(x.k)) return false;
  if(f.n && x.n!==f.n) return false;
  if(f.dur && !x.dur) return false;
  if(f.off && (x.x||x.s)) return false;
  return true;
}
function choisir(w,f,n){
  const pool=WORLD[w].bank.filter(x=>(canSpeak||x.k!=="a") && filtre(x,f));
  const jamais=shuffle(pool.filter(x=>!S.q[x.id])), rates=shuffle(pool.filter(x=>S.q[x.id]&&S.q[x.id].last===false)), sus=shuffle(pool.filter(x=>S.q[x.id]&&S.q[x.id].last===true));
  return shuffle([...jamais,...rates,...sus].slice(0,n));
}

/* Jeu « Qui est-ce ? » : reconnaître Coco déguisé */
function jeuImages(nb,task){
  hush(); closePanel();
  const liste=shuffle(MEMO).slice(0,nb); let k=0, justes=0;
  const montrer=()=>{
    if(k>=liste.length) return fin();
    const m=liste[k], opts=shuffle(m.o);
    app.innerHTML=`<div class="haut-jeu"><button class="fermer" data-act="quit" aria-label="Quitter">${ICO.x}</button><div class="jauge vert"><div style="width:${k/liste.length*100}%"></div></div><span class="chrono">${k+1}/${liste.length}</span></div>
    ${etiquetteTache(task)}<span class="etiquette" style="background:#E0457B">Qui est-ce ?</span>
    ${k===0?guide("Regarde bien l’image de Coco, puis <b>touche la bonne réponse</b>."):""}
    <img class="image-jeu" src="${srcMemo(m)}" alt="">
    <p class="question">${esc(m.q)}</p>
    <div class="options">${opts.map((o,j)=>`<button class="opt" data-opt="${j}">${esc(o)}</button>`).join("")}</div><div id="res"></div>`;
    window.scrollTo(0,0);
    app.querySelector('[data-act="quit"]').onclick=()=>{ if(confirm("Arrêter le jeu ?")) home(); };
    let fait=false;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(fait) return; fait=true; const good=opts[+b.dataset.opt]===m.o[0];
      app.querySelectorAll(".opt").forEach((x,j)=>{ x.disabled=true; if(opts[j]===m.o[0]) x.classList.add("bonne"); });
      if(good){ justes++; S.xp+=5; save(); ding(); vibre(20); b.classList.add("pop"); const r=b.getBoundingClientRect(); confettis(30, r.left+r.width/2, r.top+r.height/2); }
      else { oups(); b.classList.add("mauvaise","secoue"); }
      $("#res").innerHTML=`<p class="legende-jeu ${good?"ok":"ko"}">${good?rnd(BRAVO):"Retiens bien :"} <b>${esc(m.cap)}</b></p><div class="menu"><button class="btn ${good?"b-mint":"b-sun"} center" data-act="suite">${k+1<liste.length?"Image suivante":"Terminer"}</button></div>`;
      app.querySelector('[data-act="suite"]').onclick=()=>{ k++; montrer(); };
      $("#res").scrollIntoView({behavior:"smooth",block:"end"});
    });
  };
  const fin=()=>{
    const ev=task?marquer(task):null;
    app.innerHTML=`<div class="fin">${coco(justes>=liste.length*0.7?"fete":"bonjour","moyen")}<h2>Bien joué !</h2><p class="score">${justes} / ${liste.length}</p><p class="verdict">${justes===liste.length?"Tu as reconnu toutes les images !":"Les images t’aident à retenir. Tu les reverras sur les cartes mémoire."}</p></div>
    <div class="menu"><button class="btn b-mint center gros" data-act="suite">${!ev?"Retour à l’accueil":ev.session?"Terminer la mission":"Continuer"}</button></div>`;
    window.scrollTo(0,0); if(justes>=liste.length*0.7) confettis(40);
    app.querySelector('[data-act="suite"]').onclick=()=>ev?suiteApres(task,ev):home();
  };
  markDay(); montrer();
}

/* ===================== Jeu de la frise : remettre les événements dans l’ordre ===================== */
const EVENEMENTS=[
 [1789,"La Révolution française"],[1804,"Napoléon devient empereur"],[1848,"L’esclavage est aboli"],[1881,"L’école devient gratuite (Jules Ferry)"],
 [1905,"La loi sur la laïcité"],[1914,"Début de la Première Guerre mondiale"],[1918,"Fin de la Première Guerre mondiale"],[1939,"Début de la Seconde Guerre mondiale"],
 [1944,"Les femmes obtiennent le droit de vote"],[1945,"Fin de la Seconde Guerre mondiale"],[1957,"Création de la CEE (Europe)"],[1958,"Naissance de la Ve République"],
 [1962,"L’Algérie devient indépendante"],[1981,"La peine de mort est abolie"],[2002,"L’euro arrive dans les porte-monnaie"]
];
function frise(nb,task){
  hush(); closePanel(); let manche=0, justes=0;
  const tour=()=>{
    if(manche>=nb) return fin();
    const ev=shuffle(EVENEMENTS).slice(0,4), ordre=[];
    const dessiner=()=>{
      app.innerHTML=`<div class="haut-jeu"><button class="fermer" data-act="quit" aria-label="Quitter">${ICO.x}</button><div class="jauge vert"><div style="width:${manche/nb*100}%"></div></div><span class="chrono">${manche+1}/${nb}</span></div>
      ${etiquetteTache(task)}<span class="etiquette" style="background:#E39B00">Jeu de la frise</span>
      ${manche===0&&!ordre.length?guide("Touche les événements <b>du plus ancien au plus récent</b>."):""}
      <p class="question">${ordre.length===0?"Qu’est-ce qui s’est passé en premier ?":ordre.length===ev.length-1?"Et le dernier ?":"Et ensuite ?"}</p>
      <div class="frise-ligne">${ordre.map((e,k)=>`<div class="frise-pose"><span>${k+1}</span>${esc(e[1])}</div>`).join("")||'<p class="consigne" style="margin:0">Ta frise se construit ici.</p>'}</div>
      <div class="options">${ev.filter(e=>!ordre.includes(e)).map(e=>`<button class="opt" data-y="${e[0]}">${esc(e[1])}</button>`).join("")}</div>
      <div id="res"></div>`;
      window.scrollTo(0,0);
      app.querySelector('[data-act="quit"]').onclick=()=>{ if(confirm("Arrêter le jeu ?")) home(); };
      app.querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>{ ordre.push(ev.find(e=>e[0]===+b.dataset.y)); if(ordre.length===ev.length) verifier(); else dessiner(); });
    };
    const verifier=()=>{
      const bon=ordre.every((e,k)=>k===0||ordre[k-1][0]<=e[0]); const tri=ev.slice().sort((a,b)=>a[0]-b[0]);
      if(bon){ justes++; S.xp+=10; save(); ding(); vibre(20); confettis(40, innerWidth/2, innerHeight*0.4); } else oups();
      app.innerHTML=`<div class="haut-jeu"><button class="fermer" data-act="quit" aria-label="Quitter">${ICO.x}</button><div class="jauge vert"><div style="width:${(manche+1)/nb*100}%"></div></div><span class="chrono">${manche+1}/${nb}</span></div>
      <p class="question">${bon?rnd(BRAVO):"Presque ! Voici le bon ordre :"}</p>
      <div class="frise-ligne">${tri.map(e=>`<div class="frise-pose ok"><span>${e[0]}</span>${esc(e[1])}</div>`).join("")}</div>
      <div class="menu"><button class="btn b-mint center gros" data-act="suite">${manche+1<nb?"Frise suivante":"Terminer"}</button></div>`;
      window.scrollTo(0,0);
      app.querySelector('[data-act="quit"]').onclick=()=>home();
      app.querySelector('[data-act="suite"]').onclick=()=>{ manche++; tour(); };
    };
    dessiner();
  };
  const fin=()=>{
    const ev=task?marquer(task):null;
    app.innerHTML=`<div class="fin">${mascotte(justes>=nb*0.6?"fete":"content","grande saute")}<h2>Frise terminée !</h2><p class="score">${justes} / ${nb}</p><p class="verdict">${justes===nb?"Tu connais tes dates par cœur !":"Les dates rentrent petit à petit. Bravo !"}</p></div>
    <div class="menu"><button class="btn b-mint center gros" data-act="suite">${!ev?"Retour à l’accueil":ev.session?"Terminer la mission":"Continuer"}</button></div>`;
    window.scrollTo(0,0);
    app.querySelector('[data-act="suite"]').onclick=()=>ev?suiteApres(task,ev):home();
  };
  markDay(); tour();
}

function illustrationMission(d,s){
  const T=JOURS[d].s[s], ks=T.map(x=>x.k);
  if(ks.includes("exam")||ks.includes("frtest")) return ILLU.trophee;
  if(ks.includes("revoir")||ks.includes("faible")) return ILLU.boucle;
  if(ks.includes("parler")) return ILLU.micro;
  if(T.some(x=>x.k==="quiz"&&x.f&&x.f.k==="a")) return ILLU.casque;
  if(ks.includes("ecrire")||T.some(x=>x.f&&x.f.k==="g")) return ILLU.crayon;
  if(T.some(x=>x.f&&x.f.s===1)) return ILLU.bulles;
  if(ks.includes("cartes")) return ILLU.cartes;
  return ILLU.livre;
}
